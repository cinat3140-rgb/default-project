<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DersKulak — PDF'ini Dinle</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
:root{ --bg:#0b0f1a; --yuz:#161d2c; --yuz2:#1d2740; --cg:#2a3650; --met:#e8edf7;
  --met3:#8a94ab; --esas:#22d3ee; --esas2:#a78bfa }
body{ background:
  radial-gradient(1000px 600px at 80% -10%, #1c2a4d 0%, transparent 60%),
  var(--bg); color:var(--met);
  font-family:'Segoe UI', system-ui, sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:22px 14px 40px }
.bas{ display:flex; align-items:center; gap:12px; margin-bottom:18px }
.bas .uk{ font-size:38px; filter:drop-shadow(0 0 14px rgba(34,211,238,.55)) }
.bas b{ font-size:20px; display:block }
.bas small{ color:var(--met3); font-size:12px }
.kutu{ width:min(640px,100%); background:var(--yuz); border:1px solid var(--cg);
  border-radius:18px; padding:22px }
.sec-alan{ text-align:center; padding:14px 0 4px }
.sec-btn{ cursor:pointer; display:inline-flex; align-items:center; gap:10px;
  background:linear-gradient(135deg,var(--esas),var(--esas2)); color:#04202a;
  border:none; border-radius:14px; padding:15px 26px; font-size:16px; font-weight:800 }
.sec-btn:active{ transform:scale(.97) }
.not{ color:var(--met3); font-size:12px; margin-top:12px; line-height:1.55 }
#pdf { display:none }
/* --- yüklendi sonrası --- */
#oyuncu { display:none }
.p-ad { display:flex; align-items:center; gap:8px; margin-bottom:12px }
.p-ad .ik { font-size:22px }
.p-ad b { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.p-kontrol { display:flex; align-items:center; gap:10px; justify-content:center; margin:6px 0 14px }
.oyn { width:74px; height:74px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg,var(--esas),var(--esas2)); color:#04202a;
  font-size:30px; font-weight:800 }
.oyn:active{ transform:scale(.95) }
.atla { width:52px; height:52px; border-radius:50%; border:1px solid var(--cg);
  background:var(--yuz2); color:var(--met); font-size:18px; cursor:pointer }
.hizler { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:14px }
.hizler button { cursor:pointer; border:1px solid var(--cg); background:var(--yuz2);
  color:var(--met); border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:700 }
.hizler button.aktif { background:var(--esas); color:#04202a; border-color:transparent }
.cubuk-al { height:8px; border-radius:99px; background:var(--yuz2); overflow:hidden; margin-bottom:6px }
#cubuk { height:100%; width:0%; background:linear-gradient(90deg,var(--esas),var(--esas2));
  transition:width .3s }
.p-durum { font-size:12px; color:var(--met3); text-align:center; margin-bottom:12px }
.bolumler { max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
  padding-right:4px }
.bolumler::-webkit-scrollbar{ width:6px } .bolumler::-webkit-scrollbar-thumb{ background:var(--cg); border-radius:3px }
.blm { cursor:pointer; border:1px solid var(--cg); background:var(--yuz2);
  border-radius:10px; padding:9px 12px; font-size:13px; color:var(--met3);
  display:flex; gap:8px; align-items:center; line-height:1.5 }
.blm .n { font-weight:800; color:var(--met3); min-width:34px; font-size:11.5px }
.blm.aktif { border-color:var(--esas); color:var(--met); background:rgba(34,211,238,.08) }
.blm.aktif .n { color:var(--esas) }
.blm.okundu { color:var(--met3); opacity:.65 }
</style>
</head>
<body>

<div class="bas">
  <span class="uk">🎧</span>
  <div>
    <b>DersKulak</b>
    <small>PDF'ini yükle, sesli anlatım gibi dinle — yazın anında ses olur</small>
  </div>
</div>

<div class="kutu">

  <div class="sec-alan" id="sec">
    <button class="sec-btn" onclick="document.getElementById('pdf').click()">📄 PDF Seç</button>
    <p class="not">Dosyan tarayıcıdan çıkmaz, hiçbir yere yüklenmez.<br>
    Sadece Chrome / Edge / Android tarayıcılarda çalışır — ses tarayıcının kendi Türkçe sesidir.</p>
    <input type="file" id="pdf" accept="application/pdf">
  </div>

  <div id="oyuncu">
    <div class="p-ad"><span class="ik">📄</span><b id="sAd"></b></div>

    <div class="p-kontrol">
      <button class="atla" id="geriBtn" title="Önceki bölüm">⏮️</button>
      <button class="oyn" id="oynBtn">▶</button>
      <button class="atla" id="ileriBtn" title="Sonraki bölüm">⏭️</button>
    </div>

    <div class="hizler" id="hizler">
      <button data-hiz="0.8">0.8x</button>
      <button data-hiz="1" class="aktif">1x</button>
      <button data-hiz="1.2">1.2x</button>
      <button data-hiz="1.5">1.5x</button>
      <button data-hiz="2">2x</button>
    </div>

    <div class="cubuk-al"><div id="cubuk"></div></div>
    <p class="p-durum" id="durum">Hazır</p>

    <div class="bolumler" id="bolumler"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

var artikel = [], puan = 0, calisiyor = false, hiz = 1, hazir = false;
var sesler = [], sesSecim = null;
var $ = function (s) { return document.querySelector(s); };

/* Türkçe sesi ayıkla */
function sesleriYukle() {
  sesler = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
  if (!sesler.length) sesler = speechSynthesis.getVoices().slice(0, 1);
  sesSecim = sesler[0] || null;
}
if (typeof speechSynthesis !== 'undefined') {
  sesleriYukle();
  speechSynthesis.onvoiceschanged = sesleriYukle;
}

$('#pdf').onchange = async function () {
  const f = this.files[0];
  if (!f) return;
  $('#durum').textContent = 'PDF okunuyor…';
  try {
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const toplamSayfa = Math.min(pdf.numPages, 80);
    let yaz = '';
    for (let i = 1; i <= toplamSayfa; i++) {
      const s = await pdf.getPage(i);
      const t = await s.getTextContent();
      let syf = '';
      t.items.forEach(it => { syf += it.str; if (it.hasEOL) syf += '\n'; });
      yaz += syf + '\n\n';
      $('#durum').textContent = 'Okunuyor… sayfa ' + i + '/' + toplamSayfa;
    }
    yaz = yaz.replace(/\s+/g, ' ').trim();
    if (yaz.length < 60) { $('#durum').textContent = '❌ Bu PDF yazı kopyalanamıyor (görsel fatura taranmış olabilir).'; return; }

    /* yazıyı dinlenebilir bölümlere böl */
    artikel = [];
    const cumleler = yaz.split(/(?<=[.!?])\s+/);
    let torba = '';
    for (const c of cumleler) {
      if ((torba + ' ' + c).length > 190) { if (torba.trim()) artikel.push(torba.trim()); torba = c; }
      else torba += ' ' + c;
    }
    if (torba.trim()) artikel.push(torba.trim());
    if (!artikel.length) { $('#durum').textContent = '❌ Dinlenecek yazı bulunamadı.'; return; }

    $('#sAd').textContent = f.name.replace(/\.pdf$/i, '');
    $('#bolumler').innerHTML = artikel.map((b, i) =>
      `<div class="blm" data-i="${i}"><span class="n">${i + 1}</span>${b.slice(0, 90)}${b.length > 90 ? '…' : ''}</div>`).join('');
    document.querySelectorAll('.blm').forEach(el => el.onclick = function () { git(parseInt(this.dataset.i, 10)); });

    $('#sec').style.display = 'none';
    $('#oyuncu').style.display = 'block';
    puan = 0; hazir = true; boyaDur();
    $('#durum').textContent = 'Hazır — ▶ oynata bas';
  } catch (e) {
    $('#durum').textContent = '❓ PDF açılamadı: ' + e.message;
  }
};

function boyaDur() {
  const cb = Math.round((puan / artikel.length) * 100);
  $('#cubuk').style.width = cb + '%';
  $('#durum').textContent = calisiyor
    ? `🎧 Konuşuyor · bölüm ${puan + 1}/${artikel.length}`
    : (hazir ? `⏸ Durduruldu · bölüm ${puan + 1}/${artikel.length}` : '');
  document.querySelectorAll('.blm').forEach(el => {
    const i = parseInt(el.dataset.i, 10);
    el.classList.toggle('aktif', i === puan);
    el.classList.toggle('okundu', i < puan);
    if (i === puan) el.scrollIntoView({ block: 'nearest' });
  });
}

function konus(i) {
  if (i < 0 || i >= artikel.length) { bitir(); return; }
  puan = i;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(artikel[i]);
  u.lang = 'tr-TR'; u.rate = hiz;
  if (sesSecim) u.voice = sesSecim;
  u.onend = () => { if (calisiyor && speechSynthesis.speaking === false && !speechSynthesis.paused) konus(i + 1); };
  speechSynthesis.speak(u);
  calisiyor = true; boyaDur();
}

function bitir() { calisiyor = false; boyaDur(); $('#durum').textContent = '🎉 Bitti! PDF seç yeni metin geç.'; }

$('#oynBtn').onclick = function () {
  if (!hazir) return;
  if (speechSynthesis.paused) { speechSynthesis.resume(); calisiyor = true; }
  else if (calisiyor) { speechSynthesis.pause(); calisiyor = false; }
  else konus(puan);
  this.textContent = calisiyor ? '⏸' : '▶';
  boyaDur();
};
$('#ileriBtn').onclick = () => konus(Math.min(artikel.length - 1, puan + 1));
$('#geriBtn').onclick = () => konus(Math.max(0, puan - 1));
$('#hizler').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  hiz = parseFloat(b.dataset.hiz);
  document.querySelectorAll('.hizler button').forEach(x => x.classList.toggle('aktif', x === b));
  if (calisiyor) konus(puan);
};
function git(i) { konus(i); $('#oynBtn').textContent = '⏸'; }
window.addEventListener('beforeunload', () => { try { speechSynthesis.cancel(); } catch (e) {} });
</script>
</body>
</html>
