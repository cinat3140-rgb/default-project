<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Güncelleniyor</title>
<meta name="description" content="Tam ekran sahte sistem güncelleme ekranı.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a14'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<style>
html,body{ height:100% } *{ margin:0; padding:0; box-sizing:border-box;
  font-family:'Segoe UI',system-ui,sans-serif }
body{ background:#0a0a14 }
#merkez{ position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:26px; color:#fff; text-align:center;
  cursor:none }
#merkez.gorun{ display:flex }
#marka{ width:78px; height:78px; border-radius:50%;
  background:conic-gradient(from 130deg, #9be2ff, #00a4ef, #0078d4, #9be2ff);
  -webkit-mask:radial-gradient(closest-side, transparent 55%, #000 56%);
  mask:radial-gradient(closest-side, transparent 55%, #000 56%) }
#bas{ font-size:27px; font-weight:350 }
#alt{ font-size:16px; font-weight:350; opacity:.92 }
#pct{ font-size:16px; font-weight:600; opacity:.95; min-height:20px }
#giris{ position:fixed; inset:0; display:flex; align-items:center;
  justify-content:center; flex-direction:column; gap:18px; background:#0a0a14; color:#6cb8ff }
#giris button{ background:#0d2b4d; color:#9be2ff; border:1px solid #1d4a7a;
  font-weight:800; padding:14px 30px; font-size:15px; cursor:pointer;
  border-radius:10px }
#giris p{ color:#33547a; font-size:12px }
</style>
</head>
<body>
<div id="giris">
  <h1>DAKİKA</h1>
  <button id="basla">GÜNCELLEMEYİ AÇ</button>
  <p>tam ekran</p>
</div>
<div id="merkez">
  <div id="marka"></div>
  <div id="bas">Bilgisayarınızı kapatmayın</div>
  <div id="alt">Güncelleme yükleniyor</div>
  <div id="pct">0% tamamlandı</div>
</div>
<script>
document.getElementById('basla').onclick = () => {
  document.getElementById('giris').style.display = 'none';
  document.getElementById('merkez').classList.add('gorun');
  const el = document.getElementById('pct');
  const yuzde = [0, 12, 26, 41, 57, 74, 79, 79, 79, 85, 93, 97, 99];
  let i = 0;
  el.textContent = yuzde[0] + '% tamamlandı';
  setInterval(() => {
    i++;
    el.textContent = yuzde[Math.min(i, yuzde.length - 1)] + '% tamamlandı';
    if (i >= yuzde.length - 1) clearInterval(this);
  }, 1000);
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') location.reload();
}, true);
</script>
</body>
</html>
