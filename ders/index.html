<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Resource 3D | Odaklan ve Çöz</title>
    <!-- Google Fonts: Modern ve temiz bir yazı tipi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --accent-color: #6366f1;
            --text-color: #1f2937;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Arka plan dekoratif yuvarlaklar (Odakoo tarzı yumuşaklık için) */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--accent-color);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; }

        /* Ana Konteyner */
        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: var(--shadow);
            transition: all 0.5s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p {
            font-weight: 300;
            color: #6b7280;
            margin-bottom: 40px;
        }

        /* Yükleme Alanı (Dropzone) */
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-5px);
        }

        .upload-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #4b5563;
        }

        .upload-text span {
            color: var(--accent-color);
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        /* 3D Çalışma Alanı (Başlangıçta Gizli) */
        #workspace {
            display: none;
            width: 100%;
            height: 60vh;
            position: relative;
            perspective: 1500px;
            margin-top: 20px;
        }

        .document-3d {
            width: 300px;
            height: 400px;
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: 600;
            color: #9ca3af;
            border: 1px solid #e5e7eb;
        }

        .document-3d:active {
            cursor: grabbing;
        }

        /* Alt Menü */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #4b5563;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container fade-in">
        <div id="home-screen">
            <h1>Dijital Kaynaklarınızı Canlandırın</h1>
            <p>Dosyanızı yükleyin ve 3 boyutlu etkileşimle gerçek bir kağıda dokunur gibi çalışın.</p>

            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <span class="upload-icon">📄</span>
                <p class="upload-text">Dosyayı buraya sürükleyin veya <span>gözatın</span></p>
                <input type="file" id="fileInput" accept=".pdf,.jpg,.png,.docx">
            </div>
        </div>

        <div id="workspace">
            <div class="document-3d" id="doc3d">
                Doküman Yüklendi
            </div>
            <div class="controls">
                <button class="btn btn-secondary" onclick="resetView()">Sıfırla</button>
                <button class="btn btn-primary" onclick="location.reload()">Yeni Dosya</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const homeScreen = document.getElementById('home-screen');
        const workspace = document.getElementById('workspace');
        const doc3d = document.getElementById('doc3d');

        // Dosya seçildiğinde tetiklenir
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                startWorkspace(this.files[0].name);
            }
        });

        function startWorkspace(fileName) {
            homeScreen.style.display = 'none';
            workspace.style.display = 'block';
            doc3d.innerText = fileName;

            // Başlangıç animasyonu
            doc3d.style.transform = 'rotateY(-20deg) rotateX(10deg)';
        }

        // Basit 3D Etkileşim (Fare ile döndürme simülasyonu)
        let isDragging = false;
        let currentX = 0;
        let currentY = 0;

        doc3d.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            // Fare hareketine göre rotasyon hesaplama
            const rotationY = (e.clientX / window.innerWidth - 0.5) * 60;
            const rotationX = (e.clientY / window.innerHeight - 0.5) * -60;

            doc3d.style.transform = `rotateY(${rotationY}deg) rotateX(${rotationX}deg)`;
        });

        function resetView() {
            doc3d.style.transform = 'rotateY(0deg) rotateX(0deg)';
        }
    </script>
</body>
</html>
