<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PDF Reader | Gerçek Deneyim</title>

    <!-- Gerekli Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Turn.js - Sayfa çevirme efekti için -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3.0.0/turn.min.js"></script>

    <style>
        :root {
            --bg: #eef2f3;
            --accent: #4f46e5;
        }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* Giriş Ekranı */
        #upload-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: 0.5s opacity;
        }
        .upload-box {
            border: 3px dashed #ccc; padding: 50px; border-radius: 20px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--accent); background: #f8fafc; }
        input[type="file"] { display: none; }

        /* Kitap Alanı */
        #book-container {
            display: none; width: 100%; height: 100%;
            justify-content: center; align-items: center;
            perspective: 2000px;
        }
        #flipbook {
            width: 800px; height: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .page {
            background: white; width: 400px; height: 500px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        canvas { width: 100%; height: 100%; }

        /* Kontroller */
        .controls {
            position: fixed; bottom: 20px; display: none; gap: 10px;
        }
        button {
            padding: 10px 20px; border-radius: 10px; border: none;
            background: var(--accent); color: white; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="upload-screen">
        <div class="upload-box" onclick="document.getElementById('pdfInput').click()">
            <h2>📄 PDF Dosyasını Yükle</h2>
            <p>Dijital kaynağını 3D'ye dönüştürmek için tıkla</p>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>
    </div>

    <!-- 3D Kitap Alanı -->
    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <!-- Alt Kontroller -->
    <div class="controls" id="controls">
        <button onclick="prevPage()">⬅️ Geri</button>
        <button onclick="nextPage()">İleri ➡️</button>
        <button onclick="location.reload()" style="background:#666">🔄 Yeni Dosya</button>
    </div>

    <script>
        // PDF.js ayarları
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfInput = document.getElementById('pdfInput');
        const uploadScreen = document.getElementById('upload-screen');
        const bookContainer = document.getElementById('book-container');
        const flipbook = $('#flipbook');
        const controls = document.getElementById('controls');

        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Yükleme ekranını kaldır
            uploadScreen.style.opacity = '0';
            setTimeout(() => {
                uploadScreen.style.display = 'none';
                bookContainer.style.display = 'flex';
                controls.style.display = 'flex';
            }, 500);

            // PDF'i oku
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;

                // Sayfaları tek tek render et ve kitaba ekle
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    // Turn.js sayfa yapısı
                    const pageDiv = $('<div class="page"></div>');
                    pageDiv.append(canvas);
                    flipbook.append(pageDiv);
                }

                // Kitabı başlat
                flipbook.turn({
                    width: 800,
                    height: 500,
                    autoCenter: true,
                    acceleration: true,
                    gradients: true
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function prevPage() { flipbook.turn('previous'); }
        function nextPage() { flipbook.turn('next'); }
    </script>
</body>
</html>
