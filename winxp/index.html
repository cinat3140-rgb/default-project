<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KankaXP — Luna havali masasi</title>
<meta name="description" content="KankaXP: tarayıcıda masaüstü simülasyonu. Görünüm dili Luna esintisi; tüm kod ve çizimler özgün, Microsoft ile bağı yok.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a4c9e'/%3E%3Ctext x='16' y='22' font-size='12' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E">
<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
body{ width:100vw; height:100vh; overflow:hidden; user-select:none;
  font-family:Tahoma,'Trebuchet MS',Verdana,sans-serif; font-size:13px; background:#000 }
#boot{ position:fixed; inset:0; background:#000; z-index:900;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px }
#boot.hidden{ display:none }
#bMark{ display:flex; align-items:center; gap:14px; opacity:0; animation:bat .7s .2s ease forwards }
#bMark .kare{ width:44px; height:44px; border-radius:8px; background:linear-gradient(160deg,#3d81f4,#0a58c8);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:bold }
#bMark .yazi{ color:#e8f1ff; font-size:28px; letter-spacing:1px }
#bMark .yazi b{ color:#8fd3ff }
#bAlt{ color:#9db7d8; font-size:11px; opacity:0; animation:bat .7s .8s ease forwards }
@keyframes bat{ to{ opacity:1 } }
#bBar{ width:210px; height:14px; border:1px solid #5c5c5c; border-radius:7px; overflow:hidden; background:#000 }
#bDol{ height:100%; width:34%; background:linear-gradient(90deg,#4a7fb0,#9ecbff,#4a7fb0); border-radius:7px;
  animation:yurut 1.6s linear infinite }
@keyframes yurut{ from{ transform:translateX(-120%) } to{ transform:translateX(340%) } }

#masa{ position:fixed; inset:0; display:none }
#masa.gorun{ display:block }
.duvar{ position:absolute; inset:0; overflow:hidden; background:linear-gradient(180deg,#5a7fc4,#90b4e0 55%,#c4d9ef) }
.duvar::before, .duvar::after{ content:''; position:absolute; left:-25%; right:-25%; bottom:-16%; height:52%;
  background:radial-gradient(60% 100% at 50% 100%, #6ba328, #4c7a1e 70%, transparent); border-radius:50% 50% 0 0 }
.duvar::after{ left:-10%; right:10%; bottom:-24%; height:36%; transform:rotate(-3deg);
  background:radial-gradient(60% 100% at 60% 100%, #7fb937, #568a26 78%, transparent) }
.duvar.aksam{ background:linear-gradient(180deg,#39406e,#6b5b8e 45%,#a0877e) }
.duvar.aksam::before{ background:radial-gradient(60% 100% at 55% 100%, #4f3f63, #372c51 70%, transparent) }
.duvar.aksam::after{ background:radial-gradient(60% 100% at 45% 100%, #b46f6a, #6d4050 80%, transparent) }
.duvar.kis{ background:linear-gradient(180deg,#8fa8bd,#c4d3de 50%,#e6edf3) }
.duvar.kis::before{ background:radial-gradient(60% 100% at 50% 100%, #dfe8ee, #b9c9d3 70%, transparent) }
.duvar.kis::after{ background:radial-gradient(60% 100% at 55% 100%, #f2f7fa, #cfdde6 80%, transparent) }
.imza{ position:absolute; right:12px; bottom:52px; color:rgba(255,255,255,.85); font-size:10px; z-index:2;
  text-shadow:0 1px 2px rgba(0,0,0,.4); cursor:pointer }

#ikonlar{ position:absolute; top:12px; left:12px; z-index:3; display:flex; flex-direction:column; gap:6px }
.ikon{ width:80px; padding:6px 2px; border-radius:4px; cursor:pointer; text-align:center; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.8); font-size:11px }
.ikon.sel{ background:rgba(80,130,200,.35); outline:1px dotted rgba(255,255,255,.6) }
.ikon svg{ width:32px; height:32px; display:block; margin:0 auto 3px }

.pencere{ position:absolute; min-width:250px; background:#eef2f9; border:1px solid #0855dd;
  border-radius:8px 8px 3px 3px; box-shadow:2px 4px 14px rgba(10,40,90,.4);
  display:flex; flex-direction:column; overflow:hidden }
.pencere.tam{ inset:0 0 42px 0 !important; width:auto !important; height:auto !important; border-radius:0 }
.pencere.gizli{ display:none }
.pencere.tasiniyor{ pointer-events:none; opacity:.92 }
.bBaslik{ height:28px; display:flex; align-items:center; gap:8px; padding:0 4px 0 10px; cursor:move; flex:none;
  background:linear-gradient(180deg,#4b8bef,#2461d6 8%,#0f47b4 48%,#0b3c9d 92%,#59a2f2);
  color:#fff; font-weight:bold; font-size:12px }
.bBaslik svg{ width:16px; height:16px; flex:none }
.tuslar{ margin-left:auto; display:flex; gap:2px }
.tuslar button{ width:24px; height:22px; border:1px solid rgba(255,255,255,.5); cursor:pointer;
  background:linear-gradient(180deg,#5c96ef,#1e56c9); color:#fff; font-size:11px; border-radius:3px; line-height:1 }
.pGovde{ flex:1; overflow:auto; background:#fff; position:relative; display:flex; flex-direction:column }
.koyuGovde{ background:#0b0b0b; color:#cfcfcf }

#cubuk{ position:absolute; left:0; right:0; bottom:0; height:42px; z-index:500; display:flex; align-items:stretch;
  background:linear-gradient(180deg,#3168c2,#3f76d2 12%,#255abf 55%,#2459be 88%,#1f3f9e);
  border-top:1px solid #6ca0f0 }
#baslaBtn{ display:flex; align-items:center; gap:7px; margin:4px; padding:2px 14px; cursor:pointer; border-radius:9px;
  background:linear-gradient(180deg,#6cc94e,#3f9b2d 12%,#2f7a22 50%,#3f9b2d 88%,#6cc94e);
  color:#fff; font-size:14px; font-style:italic; font-weight:bold; text-shadow:1px 1px 2px rgba(0,0,0,.5);
  border:1px solid #1d5e14 }
#baslaBtn:hover{ filter:brightness(1.12) }
#cubukTabs{ flex:1; display:flex; align-items:center; gap:4px; padding:0 6px; min-width:0; overflow:hidden }
.tab{ display:flex; align-items:center; gap:6px; height:29px; max-width:160px; padding:0 10px; cursor:pointer;
  border-radius:3px; background:linear-gradient(180deg,#4f83d6,#2b5cb0); border:1px solid rgba(255,255,255,.25);
  color:#fff; font-size:11px; white-space:nowrap; overflow:hidden }
.tab.pasif{ filter:brightness(.82) }
.tab svg{ width:15px; height:15px; flex:none }
.tab .tYaz{ overflow:hidden; text-overflow:ellipsis }
#tepsi{ display:flex; align-items:center; gap:8px; margin-left:auto; padding:0 12px; color:#fff; font-size:11px;
  background:linear-gradient(180deg,rgba(140,180,235,.35),rgba(30,80,170,.35)); border-left:1px solid rgba(255,255,255,.25) }
#saat{ min-width:58px; text-align:right }

#bMenu{ position:absolute; left:4px; bottom:44px; width:392px; max-width:96vw; z-index:600; display:none;
  border-radius:9px 9px 0 0; overflow:hidden; box-shadow:0 -4px 22px rgba(5,25,70,.55);
  border:1px solid #234f9c; border-bottom:none; flex-direction:column; background:#eff4fa }
#bMenu.gorun{ display:flex }
#bMenuSecenek{ display:inline-block; margin:10px 16px 2px; padding:3px 22px 4px; color:#fff;
  border-radius:99px; align-self:flex-start; font-size:14px; font-style:italic; font-weight:bold;
  background:linear-gradient(180deg,#69c04a,#31821f); text-shadow:1px 1px 1px rgba(0,0,0,.4) }
#bMenuGovde{ display:flex; height:300px }
#bML{ flex:1; background:#fff; padding:10px 6px 10px 12px; overflow:auto }
#bML .satir{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:4px; cursor:pointer; color:#1a1a1a; font-size:12.5px }
#bML .satir:hover{ background:#2f68c6; color:#fff }
#bML .satir svg{ width:22px; height:22px; flex:none }
#bMR{ width:150px; flex:none; background:linear-gradient(180deg,#1d50aa,#3f8cd6 60%,#6cb2ea); color:#fff; padding:14px 12px; display:flex; flex-direction:column }
#bMR .kishi{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:12px }
#bMR .varlik{ width:52px; height:52px; border-radius:10px; border:3px solid #fff; overflow:hidden;
  background:linear-gradient(160deg,#9fd0f8,#2f68c6); display:flex; align-items:center; justify-content:center; font-size:24px }
#bMR .at{ font-size:12px }
#bMR .satir{ padding:6px 8px; border-radius:4px; cursor:pointer; font-size:12px }
#bMR .satir:hover{ background:rgba(255,255,255,.22) }
#bMR .ayri{ margin-top:auto; border-top:1px solid rgba(255,255,255,.3); padding-top:8px }
#bMenuMsg{ text-align:center; color:#eef2f9; font-size:11px; background:#3674c0; padding:5px 10px 6px }

#baglam{ position:absolute; z-index:700; width:190px; background:#f4f7fc; border:1px solid #7a94bd;
  box-shadow:3px 3px 10px rgba(20,40,80,.4); border-radius:3px; display:none; padding:2px }
#baglam.gorun{ display:block }
#baglam .satir{ padding:6px 10px; font-size:12px; cursor:pointer; border-radius:2px }
#baglam .satir:hover{ background:#2f68c6; color:#fff }
#baglam .ayra{ height:1px; background:#c2cddb; margin:3px 6px }

.notDefteri{ flex:1; width:100%; border:none; resize:none; font-family:'Lucida Console',Consolas,monospace;
  font-size:13px; padding:10px; outline:none }
.webGrid{ padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; align-content:start }
.webGrid a{ display:block; padding:9px 10px; border:1px solid #c8d5ea; border-radius:5px;
  background:linear-gradient(180deg,#fdfeff,#eef4fb); color:#144a9d; text-decoration:none; font-size:11px }
.webGrid a:hover{ border-color:#3d81f4; background:#e8f1ff }
.webGrid a b{ display:block; font-size:12px; margin-bottom:3px }
.dGrid{ padding:12px; display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start }
.dGrid .ogr{ width:72px; text-align:center; cursor:pointer; font-size:11px; color:#123 }
.dGrid .ogr svg{ width:36px; height:36px; display:block; margin:0 auto 4px }
.dTablo{ width:100%; border-collapse:collapse; font-size:12px }
.dTablo th, .dTablo td{ text-align:left; padding:5px 10px; border-bottom:1px solid #e2e9f4 }
.dTablo th{ background:#eef4fc }
.boIpucu{ padding:10px; color:#777; font-size:11px }
.hakMil{ padding:16px 18px; font-size:12px; line-height:1.75; color:#233 }
.hesGov{ background:#eef4fc; height:100%; display:flex; flex-direction:column }
.hesGov .kran{ background:#fff; border:1px solid #9cb4d8; margin:7px; padding:7px 10px; text-align:right;
  font-size:19px; font-family:'Lucida Console',Consolas,monospace; min-height:38px; overflow:hidden }
.hesGov .takim{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:0 7px 7px }
.hesGov .takim button{ font-family:inherit; font-size:14px; cursor:pointer; border-radius:5px;
  background:linear-gradient(180deg,#f6f9fd,#dde7f5); border:1px solid #93a9c8; color:#123 }
.hesGov .takim button:active{ filter:brightness(.9) }
.cmdG{ flex:1; font-family:'Lucida Console',Consolas,monospace; font-size:12.5px; padding:8px; cursor:text; white-space:pre-wrap; overflow:auto }
.cmdSat{ display:flex; gap:4px; align-items:center; padding:0 8px 8px }
.cmdSat .ucret{ color:#4ec94e; flex:none }
.cmdIn{ flex:1; background:transparent; border:none; color:#cfcfcf; font-family:inherit; font-size:12.5px; outline:none; min-width:60px }
</style>
</head>
<body>

<div id="boot">
  <div id="bMark">
    <div class="kare">X</div>
    <div class="yazi">Kanka<b>XP</b></div>
  </div>
  <div id="bBar"><div id="bDol"></div></div>
  <div id="bAlt">Görünüm dili: Luna esintisi — kod ve çizimler bize ait</div>
</div>

<div id="masa">
  <div class="duvar" id="duvar"></div>
  <div class="imza" id="imza" title="buraya tıkla, renk toparlar">KankaXP v1 — özgün yapım</div>

  <div id="ikonlar"></div>
  <div id="pencereler"></div>

  <div id="cubuk">
    <div id="baslaBtn">
      <svg viewBox="0 0 20 20" width="17" height="17"><rect x="2" y="2" width="7" height="7" rx="1" fill="#b8f56e"/><rect x="11" y="2" width="7" height="7" rx="1" fill="#7ecbf0"/><rect x="2" y="11" width="7" height="7" rx="1" fill="#ffd76e"/><rect x="11" y="11" width="7" height="7" rx="1" fill="#ff9a6e"/></svg>
      başlat
    </div>
    <div id="cubukTabs"></div>
    <div id="tepsi"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="5" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="3" width="3" height="8" rx="1" fill="#fff"/><rect x="9" y="1" width="3" height="12" rx="1" fill="#fff"/></svg><span id="saat">00:00</span></div>
  </div>

  <div id="bMenu">
    <span id="bMenuSecenek">başlat</span>
    <div id="bMenuGovde">
      <div id="bML"></div>
      <div id="bMR">
        <div class="kishi"><div class="varlik">😎</div><div class="at">kanka</div></div>
        <div class="satir" data-ac="bilimsayar">Bilgisayarım</div>
        <div class="satir" data-ac="cop">Geri Dönüşüm Kutusu</div>
        <div class="satir" data-ac="not">Not Defteri</div>
        <div class="satir" data-ac="hesap">Hesap Makinesi</div>
        <div class="satir" data-ac="cmd">Komut İstemi</div>
        <div class="satir" data-ac="web">KankaWeb</div>
        <div class="satir ayri" data-kapat="1">Kapat</div>
      </div>
    </div>
    <div id="bMenuMsg">KankaXP v1 — hoş geldin kanka</div>
  </div>

  <div id="baglam">
    <div class="satir" data-bag="duvar">Duvar kağıdını değiştir</div>
    <div class="ayra"></div>
    <div class="satir" data-bag="yenile">Yenile</div>
    <div class="ayra"></div>
    <div class="satir" data-bag="hakkinda">KankaXP Hakkında</div>
  </div>
</div>

<script>
const SV = {
  bilgisayar: '<svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="17" rx="2" fill="#dfe8f4" stroke="#2c55a8" stroke-width="1.5"/><rect x="5" y="7" width="22" height="13" fill="#2f6bd8"/><rect x="12" y="24" width="8" height="3" fill="#c3d3ea"/><rect x="8" y="27" width="16" height="2.4" rx="1" fill="#a9bede"/></svg>',
  cop: '<svg viewBox="0 0 32 32"><path d="M8 9h16l-2 19H10z" fill="#9cc3e8" stroke="#2c55a8"/><rect x="6" y="6" width="20" height="3.4" rx="1.6" fill="#c6dcf0" stroke="#2c55a8"/><path d="M13 13v12M19 13v12" stroke="#2c55a8" stroke-width="1.4"/></svg>',
  not: '<svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" rx="2" fill="#fff" stroke="#7c94b8"/><path d="M10 9h12M10 13h12M10 17h12M10 21h8" stroke="#5a6f8e" stroke-width="1.6"/></svg>',
  hesap: '<svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" rx="3" fill="#e6edf7" stroke="#2c55a8"/><rect x="9" y="6" width="14" height="6" rx="1" fill="#0d47a1"/><g fill="#3c6fc4"><rect x="9" y="15" width="4" height="4" rx="1"/><rect x="15" y="15" width="4" height="4" rx="1"/><rect x="21" y="15" width="2.6" height="4" rx="1"/><rect x="9" y="21" width="4" height="4" rx="1"/><rect x="15" y="21" width="4" height="4" rx="1"/><rect x="21" y="21" width="2.6" height="4" rx="1"/></g></svg>',
  cmd: '<svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="20" rx="2" fill="#101014" stroke="#444"/><text x="7" y="16" font-size="8" font-family="monospace" fill="#e8e8e8">C:\\</text><rect x="7" y="19" width="10" height="1.6" fill="#8fd3ff"/></svg>',
  web: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#cfe3f6" stroke="#2c55a8" stroke-width="1.5"/><path d="M4 16h24M16 4c5 5 5 19 0 24M16 4c-5 5-5 19 0 24" stroke="#2c55a8" fill="none"/></svg>',
  klasor: '<svg viewBox="0 0 32 32"><path d="M4 9h9l3 3h12v14H4z" fill="#f7cf5d" stroke="#c39a2a"/></svg>'
};
const URL_BAZ = 'https://noobtrainer23.github.io/tr-web/';
const SITELER = [
  ['play', 'Play', 'oyun sitesi'], ['ders', 'Ders', 'çalışma sekmesi'], ['puan', 'Puan', 'net hesabı'],
  ['sifre', 'Şifre', 'emoji kodlayıcı'], ['manifest', 'Manifest', 'steam künye'],
  ['stil', 'Stil', 'unicode yazı'], ['bachane', 'Bahane', 'kurtarıcı cümleler']
];
const UYGULAMALAR = {
  bilimsayar: { bas: 'Bilgisayarım', ikon: SV.bilgisayar, boyut: [420, 250], yer: [140, 90] },
  cop: { bas: 'Geri Dönüşüm Kutusu', ikon: SV.cop, boyut: [380, 220], yer: [180, 130] },
  not: { bas: 'Not Defteri', ikon: SV.not, boyut: [420, 300], yer: [110, 80] },
  hesap: { bas: 'Hesap Makinesi', ikon: SV.hesap, boyut: [250, 340], yer: [260, 100] },
  cmd: { bas: 'Komut İstemi', ikon: SV.cmd, boyut: [440, 290], yer: [100, 110], koyu: true },
  web: { bas: 'KankaWeb', ikon: SV.web, boyut: [430, 320], yer: [150, 120] },
  hakkinda: { bas: 'KankaXP Hakkında', ikon: SV.klasor, boyut: [430, 290], yer: [130, 130] }
};
const IKONLAR = ['bilimsayar', 'cop', 'not', 'hesap', 'cmd', 'web'];

const masa = document.getElementById('masa');
const pencereler = document.getElementById('pencereler');
const cubukTabs = document.getElementById('cubukTabs');
const boot = document.getElementById('boot');
let zTop = 10;
const acik = {};

/* ---- kalabalık: ikonlar + başlat listesi ---- */
document.getElementById('ikonlar').innerHTML = IKONLAR.map(k =>
  '<div class="ikon" data-ikon="' + k + '">' + UYGULAMALAR[k].ikon + '<div>' + UYGULAMALAR[k].bas + '</div></div>').join('');
document.getElementById('bML').innerHTML = IKONLAR.concat(['hakkinda']).map(k =>
  '<div class="satir" data-ac="' + k + '">' + UYGULAMALAR[k].ikon + '<span>' + UYGULAMALAR[k].bas + '</span></div>').join('');

/* ---- pencere yönetimi ---- */
function onePlan(el) {
  el.style.zIndex = ++zTop;
  document.querySelectorAll('.tab').forEach(t => t.classList.add('pasif'));
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.classList.remove('pasif');
}
function pencereGoster(el) {
  el.classList.remove('gizli');
  onePlan(el);
}
function pencereGizle(el) {
  el.classList.add('gizli');
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.classList.add('pasif');
}
function pencereKapat(el) {
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.remove();
  delete acik[el.dataset.anahtar];
  el.remove();
}
function pencereTam(el) { el.classList.toggle('tam'); }

function openApp(anahtar) {
  const ayar = UYGULAMALAR[anahtar];
  if (!ayar) return;
  if (acik[anahtar]) { pencereGoster(acik[anahtar]); return; }
  menuKapa();
  const el = document.createElement('div');
  el.className = 'pencere';
  el.dataset.anahtar = anahtar;
  const [g, h] = ayar.boyut, [x, y] = yerDuzenle(ayar.yer, g, h);
  el.style.cssText = 'left:' + x + 'px; top:' + y + 'px; width:' + g + 'px; height:' + h + 'px; z-index:' + (++zTop);
  el.innerHTML = '<div class="bBaslik">' + ayar.ikon + '<span>' + ayar.bas + '</span>' +
    '<span class="tuslar"><button data-i="1">_</button><button data-i="2">□</button><button data-i="0">×</button></span></div>' +
    '<div class="pGovde' + (ayar.koyu ? ' koyuGovde' : '') + '"></div>';
  pencereler.appendChild(el);
  el.querySelector('.bBaslik').addEventListener('pointerdown', e => {
    if (e.target.closest('.tuslar') || el.classList.contains('tam')) return;
    pencereSurukle(e, el);
  });
  el.querySelector('.tuslar').addEventListener('click', e => {
    const t = e.target.dataset.i;
    if (t === '0') pencereKapat(el);
    else if (t === '1') pencereGizle(el);
    else pencereTam(el);
  });
  el.addEventListener('pointerdown', () => onePlan(el), true);
  acik[anahtar] = el;

  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.anahtar = anahtar;
  tab.innerHTML = ayar.ikon + '<span class="tYaz">' + ayar.bas + '</span>';
  tab.onclick = () => {
    if (el.classList.contains('gizli')) pencereGoster(el);
    else if (tab.classList.contains('pasif')) pencereGoster(el);
    else pencereGizle(el);
  };
  cubukTabs.appendChild(tab);
  pencereGoster(el);
  govdeYaz(anahtar, el.querySelector('.pGovde'));
}
function yerDuzenle([x, y], g, h) {
  return [Math.max(8, Math.min(x, window.innerWidth - g - 16)), Math.max(8, Math.min(y, window.innerHeight - h - 64))];
}
function menuKapa() {
  document.getElementById('bMenu').classList.remove('gorun');
  document.getElementById('baglam').classList.remove('gorun');
}

function pencereSurukle(e, el) {
  const geri = el.getBoundingClientRect();
  const dx = e.clientX - geri.left, dy = e.clientY - geri.top;
  el.classList.add('tasiniyor');
  const hareket = ev => {
    el.style.left = Math.max(-geri.width + 130, Math.min(ev.clientX - dx, window.innerWidth - 90)) + 'px';
    el.style.top = Math.max(0, Math.min(ev.clientY - dy, window.innerHeight - 64)) + 'px';
  };
  const bitti = () => {
    el.classList.remove('tasiniyor');
    document.removeEventListener('pointermove', hareket);
    document.removeEventListener('pointerup', bitti);
  };
  document.addEventListener('pointermove', hareket);
  document.addEventListener('pointerup', bitti);
}

/* ---- gövdeler ---- */
function govdeYaz(anahtar, g) {
  if (anahtar === 'not') {
    g.innerHTML = '<textarea class="notDefteri" spellcheck="false" placeholder="yaz kanka; otomatik saklanıyor"></textarea>';
    const ta = g.querySelector('textarea');
    ta.value = localStorage.getItem('kxp_not') || '';
    ta.addEventListener('input', () => localStorage.setItem('kxp_not', ta.value));
  } else if (anahtar === 'bilimsayar') {
    g.innerHTML = '<div class="dGrid">' +
      '<div class="ogr">' + SV.klasor + '<div>B sürücüsü</div></div>' +
      '<div class="ogr">' + SV.klasor + '<div>kanka_belge</div></div>' +
      '<div class="ogr">' + SV.klasor + '<div>arsiv_2009</div></div></div>' +
      '<table class="dTablo"><tr><th>Sürücü</th><th>Kapasite</th><th>Not</th></tr>' +
      '<tr><td>B:</td><td>1,44 MB</td><td>disket hala dolu</td></tr></table>';
  } else if (anahtar === 'cop') {
    g.innerHTML = '<table class="dTablo"><tr><th>Sıra</th><th>Boyut</th></tr>' +
      '<tr><td style="color:#888">— kutu boş —</td><td>0 KB</td></tr></table>' +
      '<p class="boIpucu">Geri dönüşmeyen, kırılanda yok kanka.</p>';
  } else if (anahtar === 'hesap') {
    hesapKur(g);
  } else if (anahtar === 'cmd') {
    cmdKur(g);
  } else if (anahtar === 'web') {
    g.innerHTML = '<div class="webGrid">' +
      SITELER.map(s => '<a href="' + URL_BAZ + s[0] + '/" target="_blank"><b>' + s[1] + '</b>' + s[2] + '</a>').join('') +
      '</div><p class="boIpucu">KankaWeb — masaüstünde bizim sitelerin kısayolu</p>';
  } else if (anahtar === 'hakkinda') {
    g.innerHTML = '<div class="hakMil"><b>KankaXP v1 özenti yapım</b><br>' +
      'Renk dili Luna\'dan esinlendi; kod, çizimler, ikonlar ve masa mantığı sıfırdan bize ait.<br>' +
      'Microsoft ile bağ yok — sadece nostalji havasını paylaşıyoruz.<br><br>' +
      'Bizden sırlar: KankaWeb sekmesi, imzadaki easter egg, disket hala dolu.<br>' +
      'İmza: kanka 💚</div>';
  }
}

/* hesap makinesi — gerçek mantık */
function hesapKur(g) {
  g.innerHTML = '<div class="hesGov"><div class="kran">0</div><div class="takim"></div></div>';
  const kr = g.querySelector('.kran');
  const tk = g.querySelector('.takim');
  let cur = '0', son = null, op = null, yeni = false;
  const TUSLAR = ['C', '←', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '=', '±'];
  tk.innerHTML = TUSLAR.map(t => '<button data-t="' + t + '">' + t + '</button>').join('');
  const hes = (a, o, b) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
  function yaz() {
    const s = isNaN(parseFloat(cur)) ? 'sıfıra bölünmez' : cur;
    kr.textContent = s;
  }
  tk.addEventListener('click', e => {
    const tu = e.target.dataset.t;
    if (!tu) return;
    if (tu === 'C') { cur = '0'; son = null; op = null; yeni = false; }
    else if (tu === '←') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
    else if (tu === '±') cur = cur.startsWith('-') ? cur.slice(1) || '0' : '-' + cur;
    else if ('+-*/'.indexOf(tu) > -1 && tu.length === 1) {
      if (op !== null && son !== null && !yeni) son = hes(parseFloat(son), op, parseFloat(cur));
      else son = cur;
      if (isNaN(son)) { cur = 'sıfıra bölünmez'; op = null; son = null; yeni = false; yaz(); return; }
      op = tu; yeni = true;
      cur = String(son);
    } else if (tu === '=') {
      if (op !== null && son !== null) {
        const r = hes(parseFloat(son), op, parseFloat(cur));
        cur = isNaN(r) ? 'sıfıra bölünmez' : String(r);
      }
      op = null; son = null; yeni = true;
    } else {
      if (yeni) { cur = tu === '.' ? '0.' : tu; yeni = false; }
      else if (tu === '.' && cur.includes('.')) { yaz(); return; }
      else cur = cur === '0' && tu !== '.' ? tu : cur + tu;
    }
    yaz();
  });
  yaz();
}

/* cmd */
function cmdKur(g) {
  g.innerHTML = '<div class="cmdG">KankaXP komut satırı v1\n(harfleri yaz, enter\'a şaplat: "help")\n\n</div>' +
    '<div class="cmdSat"><span class="ucret">C:\\kanka&gt;</span>' +
    '<input class="cmdIn" spellcheck="false" autocomplete="off"></div>';
  const kar = g.querySelector('.cmdG');
  const inp = g.querySelector('.cmdIn');
  g.addEventListener('click', e => { if (!e.target.closest('input')) inp.focus(); });
  inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const met = inp.value.trim(); inp.value = '';
    kar.textContent += 'C:\\kanka> ' + met + '\n';
    const [cmd, ...p] = met.split(' ');
    if (cmd === 'cls') { kar.textContent = ''; inp.focus(); return; }
    let yanit = '"' + (cmd || '') + '" tanımıyor — help yaz\n';
    if (cmd === 'help') yanit = 'komutlar: help, dir, echo, kanka, puan\n';
    else if (cmd === 'dir') yanit = ' kanka_belge   arsiv_2009   puf.bat\n disket: 1.44 MB\n';
    else if (cmd === 'echo') yanit = p.join(' ') + '\n';
    else if (cmd === 'kanka') yanit = 'kanka! durum: iyi 💚\n';
    else if (cmd === 'puan') {
      yanit = 'puan sekmesi açılıyor...\n';
      window.open(URL_BAZ + 'puan/', '_blank');
    }
    kar.textContent += yanit;
    kar.scrollTop = kar.scrollHeight;
  });
}

/* ---- masa etkileşimleri ---- */
document.getElementById('baslaBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('baglam').classList.remove('gorun');
  document.getElementById('bMenu').classList.toggle('gorun');
});

document.addEventListener('click', e => {
  if (!e.target.closest('#bMenu') && !e.target.closest('#baslaBtn') &&
      !e.target.closest('#baglam')) menuKapa();
  const ac = e.target.closest('[data-ac]');
  if (ac) { openApp(ac.dataset.ac); return; }
  const bg = e.target.closest('[data-bag]');
  if (bg) {
    const a = bg.dataset.bag;
    menuKapa();
    if (a === 'duvar') duvarCevir();
    else if (a === 'hakkinda') openApp('hakkinda');
    else yonIkonlar();
  }
});

document.addEventListener('dblclick', e => {
  const ikon = e.target.closest('.ikon, .dGrid .ogr');
  if (ikon) {
    const k = ikon.dataset.ikon || ikon.dataset.ac || selVeAc(ikon);
    if (k) openApp(k);
  }
});
function selVeAc() { return null; }
document.getElementById('ikonlar').addEventListener('click', e => {
  document.querySelectorAll('.ikon').forEach(i => i.classList.remove('sel'));
  const ikon = e.target.closest('.ikon');
  if (ikon) ikon.classList.add('sel');
});

masa.addEventListener('contextmenu', e => {
  if (e.target.closest('.pencere') || e.target.closest('#cubuk') || e.target.closest('#bMenu')) { menuKapa(); return; }
  e.preventDefault();
  const b = document.getElementById('baglam');
  menuKapa();
  b.classList.add('gorun');
  b.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  b.style.top = Math.min(e.clientY, window.innerHeight - 160) + 'px';
});

/* kapat durumu */
document.querySelector('[data-kapat]').addEventListener('click', () => {
  masa.classList.remove('gorun');
  boot.classList.remove('hidden');
  boot.innerHTML = '<div id="bMark"><div class="kare">X</div><div class="yazi">Kanka<b>XP</b></div></div>' +
    '<div id="bAlt">Görüşürüz kanka — yeniden başlatılıyor…</div>';
  setTimeout(() => location.reload(), 1600);
});

function duvarCevir() {
  const d = document.getElementById('duvar');
  const turler = ['', 'aksam', 'kis'];
  const ip = (parseInt(d.dataset.ip || '0') + 1) % 3;
  d.dataset.ip = ip;
  d.className = 'duvar ' + turler[ip];
}
function yonIkonlar() {
  const i = document.getElementById('ikonlar');
  i.style.opacity = '0';
  setTimeout(() => { i.style.opacity = '1'; }, 180);
}

/* imza easter egg — hue oynat */
document.getElementById('imza').addEventListener('click', () => {
  const d = document.getElementById('duvar');
  const f = (parseInt(d.dataset.hue || '0') + 72) % 360;
  d.dataset.hue = f;
  d.style.filter = f ? 'hue-rotate(' + f + 'deg)' : '';
});

/* saat */
setInterval(() => {
  const n = new Date();
  document.getElementById('saat').textContent =
    String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
}, 1000);

/* açılış */
setTimeout(() => {
  boot.classList.add('hidden');
  masa.classList.add('gorun');
}, 2600);
</script>
