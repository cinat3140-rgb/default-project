<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanka11 — Fluent havalı masaüstü</title>
<meta name="description" content="Kanka11: tarayıcıda Fluent esintili masaüstü; kod ve çizimler sıfırdan bizim, Microsoft ile bağı yok.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231965b5'/%3E%3Ctext x='16' y='23' font-size='11' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3E11%3C/text%3E%3C/svg%3E">
<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
body{ width:100vw; height:100vh; overflow:hidden; user-select:none;
  font-family:'Segoe UI','Trebuchet MS',Verdana,sans-serif; font-size:13px; background:#051024 }
#kilit{ position:fixed; inset:0; z-index:950; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; color:#fff; cursor:pointer; text-align:center }
#kilit.hidden{ display:none }
#kilit .duvar{ position:absolute; inset:0; filter:blur(26px) brightness(.62); transform:scale(1.12) }
#kSaat{ position:relative; font-size:66px; font-weight:250; letter-spacing:1px }
#kAlt{ position:relative; font-size:15px; opacity:.88; animation:bat 1.3s ease infinite alternate }
@keyframes bat{ to{ opacity:.5 } }
#kNot{ position:relative; font-size:12px; opacity:.65 }
#masa{ position:fixed; inset:0; display:none }
#masa.gorun{ display:block }
.duvar{ position:absolute; inset:0; overflow:hidden; background:linear-gradient(160deg,#0b2340 0%,#1a4d8f 40%,#3f8fd0 68%,#cfe8ff 100%) }
.duvar::before, .duvar::after{ content:''; position:absolute; border-radius:50%; filter:blur(38px); opacity:.6 }
.duvar::before{ width:46vw; height:46vw; left:-8vw; top:-12vw; background:radial-gradient(circle,#31b3e8,#153f7e 70%) }
.duvar::after{ width:40vw; height:40vw; right:-6vw; bottom:-10vw; background:radial-gradient(circle,#f6a8d8,#30549e 70%) }
.duvar.gul{ background:linear-gradient(140deg,#190b33 0%,#4d1d56 40%,#b83e70 66%,#ffb9d5 100%) }
.duvar.gul::before{ background:radial-gradient(circle,#7a2f8f,#2d1440 70%) }
.duvar.gul::after{ background:radial-gradient(circle,#ffb37d,#8f2f66 70%) }
.duvar.deniz{ background:linear-gradient(150deg,#062b33 0%,#0d5a63 40%,#20a4a0 66%,#b7f0ec 100%) }
.duvar.deniz::before{ background:radial-gradient(circle,#1f8f9d,#0b3242 70%) }
.duvar.deniz::after{ background:radial-gradient(circle,#f3e89f,#1e7f7a 70%) }
body.karanlik .duvar{ filter:brightness(.55) saturate(.85) }
.imza{ position:absolute; right:14px; bottom:52px; color:rgba(255,255,255,.75); font-size:10px; z-index:2;
  text-shadow:0 1px 2px rgba(0,0,0,.5); cursor:pointer }
@keyframes batDuvar{ from{ opacity:0 } 25%{ opacity:.92 } to{ opacity:0 } }

#ikonlar{ position:absolute; top:12px; left:12px; z-index:3; display:flex; flex-direction:column; gap:8px }
.ikon{ width:86px; padding:9px 4px; border-radius:7px; cursor:pointer; text-align:center; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.85); font-size:11.5px }
.ikon.sel{ background:rgba(120,190,255,.22); outline:1px solid rgba(170,220,255,.55) }
.ikon svg{ width:34px; height:34px; display:block; margin:0 auto 4px }

.pencere{ position:absolute; min-width:280px; border-radius:10px; overflow:hidden;
  color:#122; background:rgba(250,252,255,.86);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 10px 40px rgba(4,20,50,.35);
  -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3);
  display:flex; flex-direction:column }
body.karanlik .pencere{ background:rgba(24,30,46,.86); color:#e8eeff; border-color:rgba(255,255,255,.12) }
.pencere.tam{ inset:0 0 56px 0 !important; width:auto !important; height:auto !important; border-radius:0 }
.pencere.gizli{ display:none }
.pencere.tasiniyor{ pointer-events:none; opacity:.93 }
.bBaslik{ height:34px; display:flex; align-items:center; gap:9px; padding:0 6px 0 14px; cursor:move; flex:none; font-size:12.5px }
.bBaslik svg{ width:17px; height:17px; flex:none }
.tuslar{ margin-left:auto; display:flex; gap:2px }
.tuslar button{ width:34px; height:26px; border:none; cursor:pointer; color:inherit; font-size:12px;
  border-radius:5px; background:transparent }
.tuslar button:hover{ background:rgba(120,160,220,.2) }
.tuslar button.kpat:hover{ background:#c9403f; color:#fff }
.pGovde{ flex:1; overflow:auto; margin:0 8px 8px; border-radius:7px; background:rgba(255,255,255,.6);
  position:relative; display:flex; flex-direction:column }
body.karanlik .pGovde{ background:rgba(255,255,255,.06) }

/* akıllı taskbar */
#cubuk{ position:absolute; left:50%; transform:translateX(-50%); bottom:8px; height:52px; padding:0 8px; z-index:500;
  display:flex; align-items:center; gap:4px; border-radius:12px;
  background:rgba(250,252,255,.7); border:1px solid rgba(255,255,255,.65); color:#152a44;
  box-shadow:0 4px 18px rgba(4,20,50,.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3) }
body.karanlik #cubuk{ background:rgba(22,28,44,.75); color:#e8eeff; border-color:rgba(255,255,255,.12) }
.cuBtn{ width:40px; height:40px; border:none; cursor:pointer; border-radius:8px; background:transparent;
  display:flex; align-items:center; justify-content:center; color:inherit }
.cuBtn:hover{ background:rgba(120,160,220,.2) }
.cuBtn svg{ width:22px; height:22px }
#baslaBtn svg rect{ fill:currentColor }
#cubuk .ayra{ width:1px; height:24px; background:rgba(120,150,200,.35); margin:0 4px }
.tab{ display:flex; align-items:center; gap:6px; height:38px; max-width:138px; padding:0 10px; cursor:pointer;
  border-radius:8px; font-size:11px; white-space:nowrap; overflow:hidden }
.tab.pasif{ filter:brightness(.8) }
.tab svg{ width:16px; height:16px; flex:none }
.tab .tYaz{ overflow:hidden; text-overflow:ellipsis }
#saat{ min-width:66px; text-align:right; font-size:12px; line-height:1.25 }
#saat small{ display:block; font-size:9.5px; opacity:.8 }

/* menüler (acrylic) */
.artmen{ position:absolute; z-index:600; border-radius:12px; overflow:hidden;
  background:rgba(250,252,255,.85); border:1px solid rgba(255,255,255,.7); color:#152a44;
  box-shadow:0 10px 34px rgba(4,20,50,.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.4); backdrop-filter:blur(24px) saturate(1.4) }
body.karanlik .artmen{ background:rgba(22,28,44,.9); color:#e8eeff; border-color:rgba(255,255,255,.14) }
#bMenu{ left:50%; transform:translateX(-50%); bottom:66px; width:380px; max-width:96vw; display:none }
#bMenu.gorun{ display:block }
#bMenuGovde{ padding:14px }
#bMenuGovde .ara{ width:100%; border:1px solid #a8c0e0; border-radius:99px; background:rgba(255,255,255,.5);
  color:inherit; font-family:inherit; font-size:12.5px; padding:8px 14px; outline:none; margin-bottom:12px }
body.karanlik #bMenuGovde .ara{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#e8eeff }
#pSabitler{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px }
#pSabitler .pgunit{ padding:10px 4px; border-radius:8px; cursor:pointer; text-align:center; font-size:10.5px }
#pSabitler .pgunit:hover{ background:rgba(120,160,220,.2) }
#pSabitler .pgunit svg{ width:30px; height:30px; display:block; margin:0 auto 4px }
#bMenuGovde .kisi{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(120,150,200,.3);
  display:flex; align-items:center; gap:9px; font-size:12px }
#bMenuGovde .kisi .varlik{ width:30px; height:30px; border-radius:50%; background:linear-gradient(160deg,#8fd0ff,#1d50aa);
  display:flex; align-items:center; justify-content:center; font-size:16px }
#bMenuGovde .kisi .gucom{ margin-left:auto; width:30px; height:30px; border-radius:6px; border:none; cursor:pointer;
  background:transparent; color:inherit; font-size:13px }
#bMenuGovde .kisi .gucom:hover{ background:rgba(120,160,220,.2) }
#baglam{ left:8px; zoom:1; width:210px; display:none; padding:5px; bottom:auto }
#baglam.gorun{ display:block }
#baglam .satir{ padding:8px 12px; font-size:12px; cursor:pointer; border-radius:6px; display:flex; gap:8px; align-items:center }
#baglam .satir:hover{ background:rgba(120,160,220,.2) }
#baglam .ayra{ height:1px; background:rgba(120,150,200,.35); margin:4px 8px }
#hizli{ right:8px; left:auto; transform:none; bottom:66px; width:270px; display:none }
#hizli.gorun{ display:block }
#hizli .govde{ padding:14px }
#hizli .baslik{ font-size:12px; margin-bottom:10px; font-weight:600 }
#hizli .anahtar{ display:flex; align-items:center; gap:9px; padding:8px 6px; border-radius:8px; cursor:pointer; font-size:12px }
#hizli .anahtar:hover{ background:rgba(120,160,220,.2) }
#hizli .duge{ margin-left:auto; width:40px; height:20px; border-radius:99px; border:none; cursor:pointer;
  background:rgba(120,150,200,.35); position:relative; transition:.2s }
#hizli .duge::after{ content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%;
  background:#fff; transition:.2s }
#hizli .duge.on{ background:#3f8fd0 }
#hizli .duge.on::after{ left:23px }
#hizli input[type=range]{ width:100%; accent-color:#3f8fd0 }

/* uygulama gövdeleri */
.notDefteri{ flex:1; width:100%; border:none; resize:none; font-family:'Segoe UI',Consolas,monospace;
  font-size:13px; padding:12px; outline:none; background:transparent; color:inherit }
.webGrid{ padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; align-content:start }
.webGrid a{ display:block; padding:10px; border:1px solid #b8cce8; border-radius:8px;
  background:rgba(255,255,255,.7); color:#12406e; text-decoration:none; font-size:11px }
body.karanlik .webGrid a{ background:rgba(255,255,255,.08); color:#cfe2ff; border-color:rgba(255,255,255,.14) }
.webGrid a:hover{ border-color:#3f8fd0 }
.webGrid a b{ display:block; font-size:12px; margin-bottom:3px }
.boIpucu{ padding:10px; color:#678; font-size:11px }
body.karanlik .boIpucu{ color:#9fb4d8 }
.hakMil{ padding:16px 18px; font-size:12px; line-height:1.75; color:#234 }
body.karanlik .hakMil{ color:#cfe2ff }
.hesGov{ height:100%; display:flex; flex-direction:column }
.hesGov .kran{ background:rgba(255,255,255,.7); border:1px solid #a8c0e0; margin:7px; padding:7px 10px; text-align:right;
  font-size:19px; font-family:Consolas,monospace; min-height:38px; overflow:hidden; border-radius:6px }
body.karanlik .hesGov .kran{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.2); color:#e8eeff }
.hesGov .takim{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:0 7px 7px }
.hesGov .takim button{ font-family:inherit; font-size:14px; cursor:pointer; border-radius:6px;
  background:rgba(255,255,255,.8); border:1px solid #93a9c8; color:#123 }
.hesGov .takim button:active{ filter:brightness(.9) }
body.karanlik .hesGov .takim button{ background:rgba(255,255,255,.1); color:#e8eeff; border-color:rgba(255,255,255,.2) }
.cmdGov{ flex:1; font-family:Consolas,'Lucida Console',monospace; font-size:12.5px; padding:10px;
  white-space:pre-wrap; overflow:auto; color:#d7e4f5; background:rgba(3,10,26,.96); cursor:text }
body.karanlik .cmdGov{ background:rgba(3,10,26,.99) }
.cmdSat{ display:flex; gap:4px; align-items:center; padding:0 8px 8px; background:rgba(3,10,26,.96) }
.cmdSat .ucret{ color:#5bd3a0; flex:none }
.cmdIn{ flex:1; background:transparent; border:none; color:#d7e4f5; font-family:inherit; font-size:12.5px; outline:none; min-width:60px }
.ayarGov{ padding:14px 16px; font-size:12px; line-height:1.8; overflow:auto }
.ayarGov .bolum{ margin-bottom:14px }
.ayarGov .bolum b{ display:block; margin-bottom:6px; font-size:13px }
.ayarGov .sirait{ display:flex; gap:8px; flex-wrap:wrap }
.ayarGov .sirait button{ font-family:inherit; font-size:11px; cursor:pointer; padding:7px 12px; border-radius:7px;
  border:1px solid #a8c0e0; background:rgba(255,255,255,.6); color:inherit }
body.karanlik .ayarGov .sirait button{ background:rgba(255,255,255,.08); color:#e8eeff; border-color:rgba(255,255,255,.2) }
.ayarGov .sirait button.on{ background:#3f8fd0; color:#fff; border-color:#3f8fd0 }
</style>
</head>
<body>

<div id="kilit">
  <div class="duvar" id="kDuvar"></div>
  <div id="kSaat">00:00</div>
  <div id="kAlt">masaya dönmek için tıkla, kanka</div>
  <div id="kNot">Kanka11 v1 — Fluent esintisi, özgün yapım</div>
</div>

<div id="masa">
  <div class="duvar" id="duvar"></div>
  <div class="imza" id="imza" title="gizli iş: klavyeye 'kanka' yaz">Kanka11 v1 — özgün yapım</div>

  <div id="ikonlar"></div>
  <div id="pencereler"></div>

  <div id="cubuk" class="artmen">
    <button class="cuBtn" id="baslaBtn" title="başlat">
      <svg viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.4"/><rect x="11" y="2" width="7" height="7" rx="1.4"/><rect x="2" y="11" width="7" height="7" rx="1.4"/><rect x="11" y="11" width="7" height="7" rx="1.4"/></svg>
    </button>
    <button class="cuBtn" id="araBtn" title="arama">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5.4"/><path d="M13.4 13.4 17 17" stroke-linecap="round"/></svg>
    </button>
    <button class="cuBtn" id="hizliBtn" title="hızlı ayarlar">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3"/><path d="M10 2.5v2.4M10 15.1v2.4M2.5 10h2.4M15.1 10h2.4M4.7 4.7l1.7 1.7M13.6 13.6l1.7 1.7M15.3 4.7l-1.7 1.7M6.4 13.6l-1.7 1.7" stroke-linecap="round"/></svg>
    </button>
    <span class="ayra"></span>
    <div id="cubukTabs" style="display:flex; gap:4px; min-width:0"></div>
    <span class="ayra"></span>
    <div id="saat">00:00<small>01.01.2026</small></div>
  </div>

  <div id="bMenu" class="artmen">
    <div id="bMenuGovde">
      <input class="ara" id="ara" placeholder="uygulama ara…" autocomplete="off">
      <div id="pSabitler"></div>
      <div class="kisi">
        <div class="varlik">😎</div> kanka
        <button class="gucom" id="gucom" title="kapan">⏻</button>
      </div>
    </div>
  </div>

  <div id="hizli" class="artmen">
    <div class="govde">
      <div class="baslik">hızlı ayarlar</div>
      <div class="anahtar">Karanlık mod <button class="duge" id="karanlikDuge"></button></div>
      <div class="anahtar">Parlaklık <input type="range" id="parlaklik" min="35" max="115" value="100"></div>
      <div class="anahtar">Duvar kağıdı <span id="duvarYaz" style="margin-left:auto; opacity:.7; font-size:10.5px">Ufuk</span></div>
    </div>
  </div>

  <div id="baglam" class="artmen">
    <div class="satir" data-bag="duvar">Duvar kağıdı değiştir</div>
    <div class="ayra"></div>
    <div class="satir" data-bag="hakkinda">Kanka11 Hakkında</div>
  </div>
</div>

<script>
const SV = {
  bilimsayar: '<svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="17" rx="2" fill="#e8f1fb" stroke="#2c6ab0" stroke-width="1.6"/><rect x="5" y="7" width="22" height="13" fill="#79d2ff"/><rect x="12" y="24" width="8" height="3" fill="#9fb8dd"/><rect x="8" y="27" width="16" height="2.4" rx="1" fill="#8fb0d8"/></svg>',
  cop: '<svg viewBox="0 0 32 32"><path d="M8 9h16l-2 19H10z" fill="#cfe8f8" stroke="#2c6ab0"/><rect x="6" y="6" width="20" height="3.4" rx="1.6" fill="#e2f1fc" stroke="#2c6ab0"/><path d="M13 13v12M19 13v12" stroke="#2c6ab0" stroke-width="1.4"/></svg>',
  not: '<svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" rx="2" fill="#fff" stroke="#57728f"/><path d="M10 9h12M10 13h12M10 17h12M10 21h8" stroke="#3c5470" stroke-width="1.6"/></svg>',
  hesap: '<svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" rx="3" fill="#eaf2fb" stroke="#2c6ab0"/><rect x="9" y="6" width="14" height="6" rx="1" fill="#1965b5"/><g fill="#3a72c8"><rect x="9" y="15" width="4" height="4" rx="1"/><rect x="15" y="15" width="4" height="4" rx="1"/><rect x="21" y="15" width="2.6" height="4" rx="1"/><rect x="9" y="21" width="4" height="4" rx="1"/><rect x="15" y="21" width="4" height="4" rx="1"/><rect x="21" y="21" width="2.6" height="4" rx="1"/></g></svg>',
  cmd: '<svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="20" rx="2" fill="#081120" stroke="#31527d"/><text x="7" y="16" font-size="8" font-family="monospace" fill="#9fdcff">C:\</text><rect x="7" y="19" width="10" height="1.6" fill="#5bd3a0"/></svg>',
  web: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#d5ebfc" stroke="#2c6ab0" stroke-width="1.6"/><path d="M4 16h24M16 4c5 5 5 19 0 24M16 4c-5 5-5 19 0 24" stroke="#2c6ab0" fill="none"/></svg>',
  ayar: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#57728f" stroke-width="2.4"/><circle cx="16" cy="16" r="3.2" fill="#57728f"/><g stroke="#57728f" stroke-width="2.4" stroke-linecap="round"><path d="M16 3.5v3M16 25.5v3M3.5 16h3M25.5 16h3M7.4 7.4l2.1 2.1M22.5 22.5l2.1 2.1M24.6 7.4l-2.1 2.1M9.5 22.5l-2.1 2.1"/></g></svg>',
  klasor: '<svg viewBox="0 0 32 32"><path d="M4 9h9l3 3h12v14H4z" fill="#f7cf5d" stroke="#c39a2a"/></svg>'
};
const URL_BAZ = 'https://noobtrainer23.github.io/tr-web/';
const SITELER = [
  ['play', 'Play', 'oyun sitesi'], ['ders', 'Ders', 'çalışma sekmesi'], ['puan', 'Puan', 'net hesabı'],
  ['sifre', 'Şifre', 'emoji kodlayıcı'], ['manifest', 'Manifest', 'steam künye'],
  ['stil', 'Stil', 'unicode yazı'], ['bachane', 'Bahane', 'kurtarıcı cümleler']
];
const UYGULAMALAR = {
  bilimsayar: { bas: 'Bilgisayarım', ikon: SV.bilimsayar, boyut: [420, 250], yer: [140, 90] },
  not: { bas: 'Not Defteri', ikon: SV.not, boyut: [420, 300], yer: [110, 80] },
  hesap: { bas: 'Hesap Makinesi', ikon: SV.hesap, boyut: [260, 350], yer: [280, 100] },
  cmd: { bas: 'Terminal', ikon: SV.cmd, boyut: [460, 290], yer: [100, 110] },
  ayar: { bas: 'Ayarlar', ikon: SV.ayar, boyut: [420, 320], yer: [160, 130] },
  web: { bas: 'KankaWeb', ikon: SV.web, boyut: [430, 320], yer: [150, 150] },
  hakkinda: { bas: 'Kanka11 Hakkında', ikon: SV.klasor, boyut: [430, 290], yer: [140, 160] }
};
const IKONLAR = ['bilimsayar', 'cop', 'not', 'cmd', 'web', 'ayar'];

const masa = document.getElementById('masa');
const pencereler = document.getElementById('pencereler');
const cubukTabs = document.getElementById('cubukTabs');
let zTop = 10;
const acik = {};

document.getElementById('ikonlar').innerHTML =
  IKONLAR.map(k => k === 'cop'
    ? '<div class="ikon" data-ikon="cop">' + SV.cop + '<div>Geri Dönüşüm</div></div>'
    : '<div class="ikon" data-ikon="' + k + '">' + UYGULAMALAR[k].ikon + '<div>' + UYGULAMALAR[k].bas + '</div></div>').join('');
document.getElementById('pSabitler').innerHTML =
  ['not', 'hesap', 'cmd', 'ayar', 'web', 'cop', 'bilimsayar', 'hakkinda'].map(k => {
    const a = k === 'cop' ? { bas: 'Geri Dönüşüm', ikon: SV.cop } : UYGULAMALAR[k];
    return '<div class="pgunit" data-ac="' + k + '">' + a.ikon + '<div>' + a.bas + '</div></div>';
  }).join('');

/* ---- pencere yönetimi aynı çekirdek ---- */
function onePlan(el) {
  el.style.zIndex = ++zTop;
  document.querySelectorAll('.tab').forEach(t => t.classList.add('pasif'));
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.classList.remove('pasif');
}
function pencereGoster(el) { el.classList.remove('gizli'); onePlan(el); }
function pencereGizle(el) {
  el.classList.add('gizli');
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.classList.add('pasif');
}
function pencereKapat(el) {
  const t = document.querySelector('.tab[data-anahtar="' + el.dataset.anahtar + '"]');
  if (t) t.remove();
  delete acik[el.dataset.anahtar];
  el.remove();
}
function pencereTam(el) { el.classList.toggle('tam'); }

function openApp(anahtar) {
  let a = anahtar === 'cop' ? { bas: 'Geri Dönüşüm Kutusu', ikon: SV.cop, boyut: [380, 220], yer: [180, 130] } : UYGULAMALAR[anahtar];
  if (!a) return;
  if (acik[anahtar]) { pencereGoster(acik[anahtar]); return; }
  menuKapa();
  const el = document.createElement('div');
  el.className = 'pencere';
  el.dataset.anahtar = anahtar;
  const [g, h] = a.boyut, [x, y] = yerDuzenle(a.yer, g, h);
  el.style.cssText = 'left:' + x + 'px; top:' + y + 'px; width:' + g + 'px; height:' + h + 'px; z-index:' + (++zTop);
  el.innerHTML = '<div class="bBaslik">' + a.ikon + '<span>' + a.bas + '</span>' +
    '<span class="tuslar"><button data-i="1">—</button><button data-i="2">□</button><button data-i="0" class="kpat">✕</button></span></div>' +
    '<div class="pGovde"></div>';
  pencereler.appendChild(el);
  el.querySelector('.bBaslik').addEventListener('pointerdown', e => {
    if (e.target.closest('.tuslar') || el.classList.contains('tam')) return;
    pencereSurukle(e, el);
  });
  el.querySelector('.tuslar').addEventListener('click', e => {
    const t = e.target.dataset.i;
    if (t === '0') pencereKapat(el);
    else if (t === '1') pencereGizle(el);
    else pencereTam(el);
  });
  el.addEventListener('pointerdown', () => onePlan(el), true);
  acik[anahtar] = el;

  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.anahtar = anahtar;
  tab.innerHTML = a.ikon + '<span class="tYaz">' + a.bas + '</span>';
  tab.onclick = () => {
    if (el.classList.contains('gizli')) pencereGoster(el);
    else if (tab.classList.contains('pasif')) pencereGoster(el);
    else pencereGizle(el);
  };
  cubukTabs.appendChild(tab);
  pencereGoster(el);
  govdeYaz(anahtar, el.querySelector('.pGovde'));
}
function yerDuzenle([x, y], g, h) {
  return [Math.max(8, Math.min(x, window.innerWidth - g - 16)), Math.max(8, Math.min(y, window.innerHeight - h - 76))];
}
function menuKapa() {
  document.getElementById('bMenu').classList.remove('gorun');
  document.getElementById('hizli').classList.remove('gorun');
  document.getElementById('baglam').classList.remove('gorun');
}
/* sürükle + üst deste: en üste gelirse tam ekran */
function pencereSurukle(e, el) {
  const geri = el.getBoundingClientRect();
  const dx = e.clientX - geri.left, dy = e.clientY - geri.top;
  el.classList.add('tasiniyor');
  const hareket = ev => {
    el.style.left = Math.max(-geri.width + 130, Math.min(ev.clientX - dx, window.innerWidth - 90)) + 'px';
    el.style.top = Math.max(0, Math.min(ev.clientY - dy, window.innerHeight - 76)) + 'px';
  };
  const bitti = ev => {
    el.classList.remove('tasiniyor');
    document.removeEventListener('pointermove', hareket);
    document.removeEventListener('pointerup', bitti);
    if (ev.clientY < 12) el.classList.add('tam'); /* yukarı kıstır — kanka dokunuşu */
  };
  document.addEventListener('pointermove', hareket);
  document.addEventListener('pointerup', bitti);
}

/* ---- gövdeler ---- */
function govdeYaz(anahtar, g) {
  if (anahtar === 'not') {
    g.innerHTML = '<textarea class="notDefteri" spellcheck="false" placeholder="Fluent not — otomatik saklanır"></textarea>';
    const ta = g.querySelector('textarea');
    ta.value = localStorage.getItem('k11_not') || '';
    ta.addEventListener('input', () => localStorage.setItem('k11_not', ta.value));
  } else if (anahtar === 'bilimsayar') {
    g.innerHTML = '<p class="boIpucu">Masaüstünde sadece hafıza — sürücüler, dekor olarak listelendi.</p>' +
      '<div style="padding:0 12px 12px; display:flex; gap:12px; flex-wrap:wrap">' +
      ['C Havuzu', 'kanka_klasör', 'wallpapers_new'].map(x =>
        '<div style="text-align:center; font-size:11px; cursor:pointer">' + SV.klasor + '<div>' + x + '</div></div>').join('') + '</div>';
  } else if (anahtar === 'cop') {
    g.innerHTML = '<p class="boIpucu">Boş — Fluent çöp kutusu kirlenmez kanka. 🗑️</p>';
  } else if (anahtar === 'hesap') {
    hesapKur(g);
  } else if (anahtar === 'cmd') {
    cmdKur(g);
  } else if (anahtar === 'ayar') {
    ayarKur(g);
  } else if (anahtar === 'web') {
    g.innerHTML = '<div class="webGrid">' +
      SITELER.map(s => '<a href="' + URL_BAZ + s[0] + '/" target="_blank"><b>' + s[1] + '</b>' + s[2] + '</a>').join('') +
      '</div><p class="boIpucu">KankaWeb — masaüstünden kümemize açılan pencere</p>';
  } else if (anahtar === 'hakkinda') {
    g.innerHTML = '<div class="hakMil"><b>Kanka11 v1 özenti yapım</b><br>' +
      'Fluent tasarim dili esin kaynağı; akrilik paneller, ilmek ikonlar ve pencereler bizden.<br>' +
      'Microsoft ile bağ yok — sadece ortam ruhu.<br><br>' +
      'Bizden sırlar: "kanka" kelime eingişi easter egg, üst kıstırma animasyonu, yerel ayarlar.<br>' +
      'İmza: kanka 🩵</div>';
  }
}
/* hesap */
function hesapKur(g) {
  g.innerHTML = '<div class="hesGov"><div class="kran">0</div><div class="takim"></div></div>';
  const kr = g.querySelector('.kran');
  const tk = g.querySelector('.takim');
  let cur = '0', son = null, op = null, yeni = false;
  const TUSLAR = ['C', '←', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '=', '±'];
  tk.innerHTML = TUSLAR.map(t => '<button data-t="' + t + '">' + t + '</button>').join('');
  const hes = (a, o, b) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
  function yaz() {
    const s = isNaN(parseFloat(cur)) ? 'sıfıra bölünmez' : cur;
    kr.textContent = s;
  }
  tk.addEventListener('click', e => {
    const tu = e.target.dataset.t;
    if (!tu) return;
    if (tu === 'C') { cur = '0'; son = null; op = null; yeni = false; }
    else if (tu === '←') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
    else if (tu === '±') cur = cur.startsWith('-') ? cur.slice(1) || '0' : '-' + cur;
    else if ('+-*/'.indexOf(tu) > -1 && tu.length === 1) {
      if (op !== null && son !== null && !yeni) son = hes(parseFloat(son), op, parseFloat(cur));
      else son = cur;
      if (isNaN(son)) { cur = 'sıfıra bölünmez'; op = null; son = null; yeni = false; yaz(); return; }
      op = tu; yeni = true;
      cur = String(son);
    } else if (tu === '=') {
      if (op !== null && son !== null) {
        const r = hes(parseFloat(son), op, parseFloat(cur));
        cur = isNaN(r) ? 'sıfıra bölünmez' : String(r);
      }
      op = null; son = null; yeni = true;
    } else {
      if (yeni) { cur = tu === '.' ? '0.' : tu; yeni = false; }
      else if (tu === '.' && cur.includes('.')) { yaz(); return; }
      else cur = cur === '0' && tu !== '.' ? tu : cur + tu;
    }
    yaz();
  });
  yaz();
}
/* terminal */
function cmdKur(g) {
  g.innerHTML = '<div class="cmdGov">Kanka11 Terminal [sürüm 1.0]\n("help" yaz)\n\n</div>' +
    '<div class="cmdSat"><span class="ucret">PS C:\\kanka&gt;</span>' +
    '<input class="cmdIn" spellcheck="false" autocomplete="off"></div>';
  const kar = g.querySelector('.cmdGov');
  const inp = g.querySelector('.cmdIn');
  g.addEventListener('click', e => { if (!e.target.closest('input')) inp.focus(); });
  inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const met = inp.value.trim(); inp.value = '';
    kar.textContent += 'PS C:\\kanka> ' + met + '\n';
    const [cmd, ...p] = met.split(' ');
    if (cmd === 'cls') { kar.textContent = ''; inp.focus(); return; }
    let yanit = '"' + (cmd || '') + '" hiç bilinmiyor — help yaz\n';
    if (cmd === 'help') yanit = 'komutlar: help, dir, echo, kanka, duvar, puan\n';
    else if (cmd === 'dir') yanit = ' kanka_klasor   wallpapers_new  fluent_theme.css\n';
    else if (cmd === 'echo') yanit = p.join(' ') + '\n';
    else if (cmd === 'kanka') yanit = 'kanka! bağlantı: mavi 🩵\n';
    else if (cmd === 'duvar') { yanit = 'duvar kağıdı değişiyor...\n'; duvarCevir(); }
    else if (cmd === 'puan') { yanit = 'puan sekmesi açılıyor...\n'; window.open(URL_BAZ + 'puan/', '_blank'); }
    kar.textContent += yanit;
    kar.scrollTop = kar.scrollHeight;
  });
}
/* ayarlar (bizden: yerel tema atölyesi) */
function ayarKur(g) {
  g.innerHTML = '<div class="ayarGov">' +
    '<div class="bolum"><b>Görünüm</b><div class="sirait">' +
    '<button data-tema="ufuk">Ufuk</button><button data-tema="gul">Gül</button><button data-tema="deniz">Deniz</button>' +
    '</div></div>' +
    '<div class="bolum"><b>Mod</b><div class="sirait">' +
    '<button id="modButon2">Karanlık mod aç/kapat</button>' +
    '</div></div>' +
    '<div class="bolum"><b>Bizden: gizli</b><div style="opacity:.85">Klavyede <b>kanka</b> yaz — duvar canlanır 🌈<br>' +
    'Terminalden <b>duvar</b> komutu — duvar değişer.</div></div></div>';
  g.querySelectorAll('[data-tema]').forEach(b => b.addEventListener('click', () => {
    temaSec(b.dataset.tema);
    g.querySelectorAll('[data-tema]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  }));
  g.querySelector('#modButon2').addEventListener('click', karanlikCevir);
}
function temaSec(t) {
  const d = document.getElementById('duvar');
  const esle = { ufuk: '', gul: 'gul', deniz: 'deniz' };
  d.className = 'duvar ' + esle[t];
  document.getElementById('kDuvar').className = 'duvar ' + esle[t];
  const yad = document.getElementById('duvarYaz');
  if (yad) yad.textContent = t.charAt(0).toUpperCase() + t.slice(1);
  d.dataset.tema = t;
}
function duvarCevir() {
  const d = document.getElementById('duvar');
  const turler = ['ufuk', 'gul', 'deniz'];
  const ip = (turler.indexOf(d.dataset.tema) + 1) % 3;
  temaSec(turler[ip]);
}
function karanlikCevir() {
  document.body.classList.toggle('karanlik');
  const d = document.getElementById('karanlikDuge');
  if (d) d.classList.toggle('on', document.body.classList.contains('karanlik'));
}
/* "kanka" klavye easter egg */
let yazilan = '';
document.addEventListener('keydown', e => {
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    yazilan = (yazilan + e.key.toLowerCase()).slice(-5);
    if (yazilan === 'kanka') {
      yazilan = '';
      gokus();
      setTimeout(gokus, 400);
      setTimeout(gokus, 800);
    }
  }
});
function gokus() {
  const d = document.getElementById('duvar');
  const el = document.createElement('div');
  el.className = 'imza';
  el.style.cssText = 'left:50%; top:40%; bottom:auto; right:auto; transform:translate(-50%,-50%); font-size:44px; opacity:.85; color:#fff;' +
    'text-shadow:0 0 16px rgba(255,255,255,.8); animation:batDuvar 1.2s ease both';
  el.textContent = 'kanka 🌈';
  d.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

/* açılış: tıkla → masa */
document.getElementById('kilit').addEventListener('click', () => {
  document.getElementById('kilit').classList.add('hidden');
  masa.classList.add('gorun');
});
/* kilit ekranı saat */
setInterval(() => {
  const n = new Date();
  const saat = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
  document.getElementById('kSaat').textContent = saat;
  document.getElementById('saat').innerHTML = saat +
    '<small>' + String(n.getDate()).padStart(2, '0') + '.' + String(n.getMonth() + 1).padStart(2, '0') + '.' + n.getFullYear() + '</small>';
}, 1000);

/* ---- masa etkileşimleri ---- */
document.getElementById('baslaBtn').addEventListener('click', e => {
  e.stopPropagation();
  const m = document.getElementById('bMenu');
  const h = document.getElementById('hizli');
  const yusuf = m.classList.contains('gorun');
  menuKapa();
  if (!yusuf) { m.classList.add('gorun'); document.getElementById('ara').value = ''; pSabitGecir(''); setTimeout(() => document.getElementById('ara').focus(), 50); }
});
function pSabitGecir(f) {
  const y = document.getElementById('pSabitler');
  [...y.children].forEach(x => {
    const tut = x.textContent.toLowerCase();
    x.style.display = !f || tut.includes(f) ? '' : 'none';
  });
}
document.getElementById('ara').addEventListener('input', e => pSabitGecir(e.target.value.toLowerCase()));
document.getElementById('araBtn').addEventListener('click', e => {
  e.stopPropagation();
  menuKapa();
  document.getElementById('bMenu').classList.add('gorun');
  document.getElementById('ara').value = '';
  pSabitGecir('');
  setTimeout(() => document.getElementById('ara').focus(), 50);
});
document.getElementById('hizliBtn').addEventListener('click', e => {
  e.stopPropagation();
  const h = document.getElementById('hizli');
  const onKapali = h.classList.contains('gorun');
  menuKapa();
  if (!onKapali) h.classList.add('gorun');
});
document.getElementById('karanlikDuge').addEventListener('click', karanlikCevir);
document.getElementById('parlaklik').addEventListener('input', e => {
  const v = e.target.value / 100;
  document.getElementById('duvar').style.filter = 'brightness(' + v + ')';
});
document.getElementById('gucom').addEventListener('click', () => {
  masa.classList.remove('gorun');
  document.getElementById('kilit').classList.remove('hidden');
});
document.addEventListener('click', e => {
  const kap = !e.target.closest('#bMenu') && !e.target.closest('#hizli') &&
    !e.target.closest('#baslaBtn') && !e.target.closest('#araBtn') &&
    !e.target.closest('#hizliBtn') && !e.target.closest('#baglam');
  if (kap) menuKapa();
  const ac = e.target.closest('[data-ac]');
  if (ac) { openApp(ac.dataset.ac); return; }
  const bg = e.target.closest('[data-bag]');
  if (bg) {
    const a = bg.dataset.bag;
    menuKapa();
    if (a === 'duvar') duvarCevir();
    else if (a === 'hakkinda') openApp('hakkinda');
  }
});
document.addEventListener('dblclick', e => {
  const ikon = e.target.closest('.ikon, .dGrid .ogr');
  if (ikon) openApp(ikon.dataset.ikon);
});
document.getElementById('ikonlar').addEventListener('click', e => {
  document.querySelectorAll('.ikon').forEach(i => i.classList.remove('sel'));
  const ikon = e.target.closest('.ikon');
  if (ikon) ikon.classList.add('sel');
});
masa.addEventListener('contextmenu', e => {
  if (e.target.closest('.pencere') || e.target.closest('#cubuk') || e.target.closest('#bMenu') || e.target.closest('#hizli')) { menuKapa(); return; }
  e.preventDefault();
  const b = document.getElementById('baglam');
  menuKapa();
  b.classList.add('gorun');
  b.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
  b.style.top = Math.min(e.clientY, window.innerHeight - 140) + 'px';
});
document.getElementById('imza').addEventListener('click', () => {
  document.getElementById('duvar').style.filter = 'hue-rotate(' + ((parseInt(document.getElementById('duvar').dataset.hue || '0') + 72) % 360) + 'deg)';
  document.getElementById('duvar').dataset.hue = (parseInt(document.getElementById('duvar').dataset.hue || '0') + 72) % 360;
});
/* aşırı: batDuvar animasyonu — script sonu */
</script>
