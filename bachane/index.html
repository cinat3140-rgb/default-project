<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahane Makinesi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
:root{ --bg:#0b0f1a; --yuz:#161d2c; --yuz2:#1d2740; --cg:#2a3650; --met:#e8edf7;
  --met3:#8a94ab; --esas:#fbbf24; --esas2:#f59e0b }
body{ background:
  radial-gradient(1000px 600px at 80% -10%, #3a2f12 0%, transparent 60%),
  radial-gradient(900px 500px at 10% 110%, #2a1c46 0%, transparent 55%),
  var(--bg); color:var(--met);
  font-family:'Segoe UI', system-ui, sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:24px 14px 40px }
.bas{ text-align:center; margin-bottom:20px }
.bas .uk{ font-size:46px; display:block; filter:drop-shadow(0 0 16px rgba(251,191,36,.5)) }
.bas b{ font-size:22px; display:block; margin-top:6px }
.bas small{ color:var(--met3); font-size:12.5px }
.kutu{ width:min(560px,100%); background:var(--yuz); border:1px solid var(--cg);
  border-radius:20px; padding:22px; text-align:center }
.card{ min-height:170px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; border-radius:16px; padding:20px 16px;
  background:var(--yuz2); border:1px solid var(--cg); margin-bottom:18px }
.card .ik{ font-size:48px }
.card h2{ font-size:19px; line-height:1.4 }
.card p{ color:var(--met3); font-size:13.5px; line-height:1.55; max-width:430px }
.card.pop{ animation:pop .35s cubic-bezier(.2,1.6,.4,1) }
@keyframes pop{ 0%{ transform:scale(.85); opacity:0 } 100%{ transform:scale(1); opacity:1 } }
.buyuk{ padding:18px 34px; border-radius:99px; border:none; cursor:pointer;
  background:linear-gradient(135deg,var(--esas),var(--esas2)); color:#2a1c00;
  font-size:20px; font-weight:900; box-shadow:0 10px 30px rgba(251,191,36,.25);
  transition:transform .12s }
.buyuk:active{ transform:scale(.95) }
.alt{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px }
.alt button{ cursor:pointer; border:1px solid var(--cg); background:var(--yuz2);
  color:var(--met); border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600 }
.alt button:hover{ border-color:var(--esas) }
.sayac{ margin-top:14px; font-size:12px; color:var(--met3) }
</style>
</head>
<body>

<div class="bas">
  <span class="uk">🙃</span>
  <b>Bahane Makinesi</b>
  <small>Kankalara özel: saçma ama inandırıcı bahaneler. Kopyala, gönder, kurtul.</small>
</div>

<div class="kutu">
  <div class="card" id="kart">
    <span class="ik" id="kIk">🤔</span>
    <h2 id="kBas">Butona bas</h2>
    <p id="kAlt">Sana kankalarını ikna edecek bir bahane üreteceğim.</p>
  </div>

  <button class="buyuk" id="buyuk">BAHANE ÜRET 🎯</button>

  <div class="alt">
    <button id="kopya">📋 Kopyala</button>
    <button id="baska">➡️ Başka Bahane</button>
  </div>
  <p class="sayac" id="sayac">0 bahane ürettin</p>
</div>

<script>
const B = [
  ["🐱","Kanka kedimin maması bitti, mağaza kapanıyor. Yarın kahve benden.","Hayvan işi önce gelir. Kahve sözü buluşmayı kurtarır."],
  ["🔋","Kanka şarjım yüzde üç kaldı, eve girince yazarım.","Pil hakkı tartışmasız. Eve varınca mesaj atarsın."],
  ["🧹","Kanka annem temizlik tutturdu, odamı toplamam gerek. Bitince yazarım.","Anne emri geçer. Bitince mesaj atarsın."],
  ["🎓","Kanka hocam proje dosyasını bekliyor, teslim ediyorum. Bir saat sonra yetişirim.","Proje teslimi önemli. Saat verirsen kanka bekler."],
  ["🚗","Kanka arabamın lastiği patladı, servise bıraktım. Yarın buluşalım.","Lastik patlaması kimseye tuhaf gelmez. Yarına söz var."],
  ["👨‍👩‍👧","Kanka aile yemeğine kaldım, çıkamam. Yarın saat sekizde oradayım.","Aile yemeği pas geçilmez. Kesin saat verirsin."],
  ["🛠️","Kanka musluk patladı, tamirci kapıda. Yarın konuşuruz.","Ev tamiri acildir. Kimse tartışmadan kabul eder."],
  ["🏥","Kanka ablama hastane randevusu çıktı, götürmem gerek.","Hastane görevi kimseye açıklanmaz bile."],
  ["🚦","Kanka asansör bozuldu, merdivenden inmem lazım. Geç yetişirim.","Asansör arızası klasik. Geç gelmak normal sayılır."],
  ["🩺","Kanka doktora gittim, dinlenmemi önerdi. Akşam katılırım.","Doktor önerisi pazarlıksız. Akşam buluşmayı kurtarır."],
  ["📱","Kanka telefonum servise girdi, ikinci telefonla ararım. Akşam yer bulabiliriz.","Servis hikayesi kesin. Akşam planı kalır."],
  ["🐕","Kanka köpeğimi yürüyüşe çıkardım, yorgunum. Yarın kebap benden.","Köpek işi kutsal. Kebap sözüyle buluşma güvencede."],
  ["🎬","Kanka ailem film akşamı yapıyor, bugün çıkamam. Yarın kahve benden.","Aile akşamı olmazsa olmaz. Kahve sözü iyi durur."],
  ["🧑‍🍳","Kanka abime yemek taşıyorum, kırk beş dakikada yetişirim. Beni bekleyin.","Yemek taşıma görevi sağlam. Süre belli, kanka bekler."],
  ["🚑","Kanka komşumun tesisatı patladı, yardım ediyorum. Yarın buluşuruz.","Komşu yardımı iyidir. Hiç kimse soru sormaz."],
  ["🎮","Kanka bugün konsolda yazılım güncellemesi uzun sürüyor, evdeyim. Yarın konuşuruz.","Güncelleme esprili. Yarına netleşme bırakılır."],
  ["🥱","Kanka bugün çok yorgunum, eve yatayım. Yarın iyi görüşürüz.","Yorgunluk her zaman kabul edilir. Yarına söz verirsin."],
];

const kart = document.getElementById('kart');
const kartIk = document.getElementById('kIk');
const kartBas = document.getElementById('kBas');
const kartAlt = document.getElementById('kAlt');
const buyuk = document.getElementById('buyuk');
const sayacEl = document.getElementById('sayac');

let adet = 0;
const gecmis = [];

function rastgele() {
  if (!B.length) return;
  let sec;
  do { sec = B[Math.floor(Math.random() * B.length)]; }
  while (B.length > 1 && gecmis.includes(sec[1]) && gecmis.length < B.length);
  gecmis.push(sec[1]); if (gecmis.length > 7) gecmis.shift();
  kartIk.textContent = sec[0];
  kartBas.textContent = sec[1];
  kartAlt.textContent = sec[2];
  kart.classList.remove('pop'); void kart.offsetWidth; kart.classList.add('pop');
  adet++;
  sayacEl.textContent = adet + ' bahane ürettin — kankalar sana şaşırdı 😉';
  try { localStorage.setItem('bm_adet', adet); } catch (e) {}
}
try { adet = parseInt(localStorage.getItem('bm_adet'), 10) || 0; } catch (e) {}
sayacEl.textContent = adet ? adet + ' bahane ürettin — devam!' : '0 bahane ürettin';

buyuk.onclick = rastgele;
document.getElementById('baska').onclick = rastgele;
document.getElementById('kopya').onclick = () => {
  navigator.clipboard.writeText(kartBas.textContent).then(() => {
    document.getElementById('kopya').textContent = '✅ Kopyalandı';
    setTimeout(() => document.getElementById('kopya').textContent = '📋 Kopyala', 1400);
  });
};
</script>
</body>
</html>
