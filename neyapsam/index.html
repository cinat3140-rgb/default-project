<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ne Yapsam? — Can Sıkıntısı Çözücü</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
:root{ --bg:#0b0f1a; --yuz:#161d2c; --yuz2:#1d2740; --cg:#2a3650; --met:#e8edf7;
  --met3:#8a94ab; --esas:#f472b6; --esas2:#a78bfa }
body{ background:
  radial-gradient(1000px 600px at 20% -10%, #3a1c46 0%, transparent 60%),
  radial-gradient(900px 500px at 90% 110%, #14264a 0%, transparent 55%),
  var(--bg); color:var(--met);
  font-family:'Segoe UI', system-ui, sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:24px 14px 40px }
.bas{ text-align:center; margin-bottom:20px }
.bas .uk{ font-size:46px; display:block; filter:drop-shadow(0 0 16px rgba(244,114,182,.55)) }
.bas b{ font-size:22px; display:block; margin-top:6px }
.bas small{ color:var(--met3); font-size:12.5px }

.kutu{ width:min(560px,100%); background:var(--yuz); border:1px solid var(--cg);
  border-radius:20px; padding:22px; text-align:center }

.filtre{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin-bottom:18px }
.filtre button{ cursor:pointer; border:1px solid var(--cg); background:var(--yuz2);
  color:var(--met); border-radius:99px; padding:7px 15px; font-size:12.5px; font-weight:700 }
.filtre button.aktif{ background:var(--esas); color:#2a0a1e; border-color:transparent }

.card{ min-height:190px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; border-radius:16px; padding:20px 16px;
  background:var(--yuz2); border:1px solid var(--cg); margin-bottom:18px }
.card .ik{ font-size:56px; line-height:1 }
.card h2{ font-size:20px }
.card p{ color:var(--met3); font-size:14px; line-height:1.55; max-width:420px }
.card .til{ font-size:11px; font-weight:700; color:var(--esas);
  letter-spacing:1px; padding:4px 12px; border-radius:99px; background:rgba(244,114,182,.12) }
.card.pop{ animation:pop .35s cubic-bezier(.2,1.6,.4,1) }
@keyframes pop{ 0%{ transform:scale(.85); opacity:0 } 100%{ transform:scale(1); opacity:1 } }

.buyuk{ width:230px; height:230px; border-radius:50%; border:none; cursor:pointer;
  background:radial-gradient(circle at 30% 30%, #ff8ac2, var(--esas) 60%, #c026d3);
  color:#2a0a1e; font-size:27px; font-weight:900; line-height:1.25;
  box-shadow:0 0 0 0 rgba(244,114,182,.5); animation:nabiz 2s infinite;
  transition:transform .12s }
.buyuk:active{ transform:scale(.93) }
@keyframes nabiz{ 0%{ box-shadow:0 0 0 0 rgba(244,114,182,.45) } 70%{ box-shadow:0 0 0 26px rgba(244,114,182,0) } 100%{ box-shadow:0 0 0 0 rgba(244,114,182,0) } }

.alt{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px }
.alt button{ cursor:pointer; border:1px solid var(--cg); background:var(--yuz2);
  color:var(--met); border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600 }
.alt button:hover{ border-color:var(--esas) }
.sayac{ margin-top:14px; font-size:12px; color:var(--met3) }
</style>
</head>
<body>

<div class="bas">
  <span class="uk">😐</span>
  <b>Ne Yapsam?</b>
  <small>Canın mı sıkıldı? Butona bas — sana yapacak iş bulsun</small>
</div>

<div class="kutu">
  <div class="filtre" id="filtre">
    <button data-f="hepsi" class="aktif">🎲 Hepsi</button>
    <button data-f="hemen">⚡ Hemen (1 dk)</button>
    <button data-f="bes">🕐 5 dk</button>
    <button data-f="onbes">🕐 15 dk</button>
    <button data-f="saat">🕐 1 saat</button>
  </div>

  <div class="card" id="kart">
    <span class="ik" id="kIk">🥱</span>
    <span class="til" id="kTil" hidden></span>
    <h2 id="kBas">Butona bas</h2>
    <p id="kAlt">Sıkıntı buraya kadar. Ben sana ne yapacağını söylüyorum, sen sadece uygula.</p>
  </div>

  <button class="buyuk" id="buyuk">SÖYLE<br>BANA 🎯</button>

  <div class="alt">
    <button id="kopya">📋 Kopyala</button>
    <button id="baska">➡️ Başka Ver</button>
  </div>
  <p class="sayac" id="sayac">0 öneri aldın</p>
</div>

<script>
const S = [
  ["⚡","hemen","10 şınav çek","Şu an, kıyafetle beraber. Sadece 10 tane. Bitince kendini iyi hissedeceksin.","Hemen"],
  ["⚡","hemen","30 saniye derin nefes","Gözlerini kapat. 4 saniye içine al, 4 saniye dışına ver. 6 kez yap. Zihnin sıfırlanır.","Hemen"],
  ["⚡","hemen","Bir bardak su iç","Sıkıntının yarısı aslında susuzlukmış. Dene, gerçekten işe yarıyor.","Hemen"],
  ["⚡","hemen","Pencereyi aç","Odanın havasını değiştir. Hava yüzüne değince beden uyanır.","Hemen"],
  ["⚡","hemen","Dişlerini fırçala","Yeniden başlama hissi verir. Ağzın taze olunca her şey daha kolay gelir.","Hemen"],
  ["⚡","hemen","Aynaya garip bir yüz yap","Ciddiyet yıkılır, gülme çıkar. En ucuz keyiflenme biçimi.","Hemen"],
  ["⚡","hemen","Tek şarkıyı baştan sona dinle","Yatağa uzan, kulaklık tak, başka hiçbir ekrana bakma.","Hemen"],
  ["⚡","hemen","Masandaki 3 şeyi düzelt","Küçük bir düzen = büyük bir zihin ferahlığı. Beyin düzene bayılır.","Hemen"],
  ["⚡","hemen","Bir bardak çay yap","Demlemesi bile terapi. Müzik aç, küçük bir kıymet molası.","Hemen"],
  ["⚡","hemen","Birini ara ya da güzel bir mesaj yaz","İnsanla temas = en hızlı keyif fırlatıcısı. Karşısı da sevinir.","Hemen"],
  ["🕐","bes","En sevdiğin şarkının klibini izle","5 dakikalık mutluluk dozu. Kulaklık şart.","5 dk"],
  ["🕐","bes","Bir günlük yaz","Aklından geçen ne varsa 5 dakika boyunca yaz. Kimseye göstermeyeceksin, zihin boşalır.","5 dk"],
  ["🕐","bes","Etrafta 5 kırmızı obje bul","Göz oyunu. Dikkat başka yöne kayar, sıkıntı dağılır.","5 dk"],
  ["🕐","bes","Balkonda ya da pencere kenarında 5 dakika dur","Güneş ve hava. Bedava iyilik paketi.","5 dk"],
  ["🕐","bes","Kolay bir bulmaca çöz","Bir bulmaca ya da zeka oyunu. Bitince aklın ferahlar.","5 dk"],
  ["🕐","bes","Masanın bir köşesini yeniden düzenle","Farklılık = ferahlık. Fotoğrafını da çek.","5 dk"],
  ["🕐","bes","Kısa bir esprı yaz","Kalemini al, kendini güldürmeyi dene. Eğlence sana kalır.","5 dk"],
  ["🕐","bes","Yeni bir kelime öğren","Bugün öğrendiğin kelimeyi bir cümle içinde kullan.","5 dk"],
  ["🕐","bes","Telefonu 5 dakika bırak","Ekransız 5 dakika. Kimse senden bir şey istemiyor; sadece sen varsın.","5 dk"],
  ["🕐","bes","Eski fotoğraflarına bir bak","1 yıl önceki sen nasıl biriydi? Gülümseme garantili.","5 dk"],
  ["🕐","onbes","Telefonsuz 15 dakika yürü","Telefonu evde bırak. Sen + yol + düşünce. Beyni kendini düzeltir.","15 dk"],
  ["🕐","onbes","Bir bölgeyi derin temizle","Birden fazla kalem boşalt. Zihnin de dökülür.","15 dk"],
  ["🕐","onbes","Bir podcast başlat","İlgini çeken bir konu seç ve 15 dakika dinle. Beyin yeni gıdasına bayılır.","15 dk"],
  ["🕐","onbes","Yüzünü yıkadıktan sonra 15 dakika uzan","Soğuk su + sessizlik. Kendine mini-spa yap.","15 dk"],
  ["🕐","onbes","Bir çizim yap","Kalemi al, masadaki bir şeyi çiz. Kötü olsun, sorun yok — eğlence gerçek.","15 dk"],
  ["🕐","onbes","Yeni bir meyve ye","Daha önce denemediğin bir meyve. Beynin yeni tat bayramını kutlar.","15 dk"],
  ["🕐","onbes","Bir kısa film izle","15 dakikalık bir hikâye. Dünyadan 15 dk uzaklaşırsın.","15 dk"],
  ["🕐","onbes","Şarkının bir nakaratını öğren","Tek bir nakarat bile keyiflendirir. Sesin olsun ya da olmasın, iyi his verir.","15 dk"],
  ["🕐","onbes","Balkonda 15 dakika oturup gözlerini kapat","Teknoloji yok. Sadece sesler, nefes ve boşluk.","15 dk"],
  ["🕐","onbes","En sevdiğin yemeği sipariş ver","Bunu hak ettin. Kendine bir lezzet ikramı yap.","15 dk"],
  ["🕐","saat","Bir yemek yap","Kendin elinle bir şey pişir. Mutfağa geçmek = en büyük terapilerden biri.","1 saat"],
  ["🕐","saat","Bir bölüm dizi ya da film bitir","Kafanı boşalt. 40 dakika başka bir hayatta ol.","1 saat"],
  ["🕐","saat","Balkonda ya da dışarıda mini yürüyüş turu","30 dakika yürü, çektiğin fotoğrafları galerine koy, geri gel.","1 saat"],
  ["🕐","saat","Bir kitabın 20 sayfasını oku","Kitabını al, 20 sayfa oku. Dış dünyadan 30 dakika kaç.","1 saat"],
  ["🕐","saat","7 gün sonraki kendine mektup yaz","Bugün ne hissediyorsan yaz. 7 gün sonra kendine oku.","1 saat"],
  ["🕐","saat","Bilgisayarını temizle","Masaüstünde dağ gibi ikon var mı? Temizlemek çok tatlı bir ödül.","1 saat"],
  ["🕐","saat","Bir arkadaşına sürpriz mesaj yaz","'Bugün seni hatırladım' demek 5 saniye sürer, gülümseme 5 saat sürer.","1 saat"],
  ["🕐","saat","Balkona bitki dik ya da çim ekle","Bir saksı, bir tohum. 2 hafta sürecek bir umut oluşturursun.","1 saat"],
  ["🕐","saat","Yeni bir müzik listesi kur","10 şarkılık bir yaklaşım. Modunu yazar gibi kur.","1 saat"],
  ["🕐","saat","Telefonu 1 saat kapalı bırak","Evet, gerçekten. Kapat. Bir saat sonra bak, özgür hissedeceksin.","1 saat"]
];

const kart = document.getElementById('kart');
const kartIk = document.getElementById('kIk');
const kartTil = document.getElementById('kTil');
const kartBas = document.getElementById('kBas');
const kartAlt = document.getElementById('kAlt');
const buyuk = document.getElementById('buyuk');
const sayacEl = document.getElementById('sayac');
const filtreEl = document.getElementById('filtre');

let filtre = 'hepsi', adet = 0;
const gecmis = [];

function rastgele() {
  const havuz = S.filter(s => filtre === 'hepsi' || s[1] === filtre);
  if (!havuz.length) return;
  let sec;
  do { sec = havuz[Math.floor(Math.random() * havuz.length)]; }
  while (havuz.length > 1 && gecmis.includes(sec[2]) && gecmis.length < havuz.length);
  gecmis.push(sec[2]); if (gecmis.length > 6) gecmis.shift();
  kartIk.textContent = sec[0];
  kartTil.hidden = false; kartTil.textContent = '⏱ ' + sec[4];
  kartBas.textContent = sec[2];
  kartAlt.textContent = sec[3];
  kart.classList.remove('pop'); void kart.offsetWidth; kart.classList.add('pop');
  adet++;
  sayacEl.textContent = adet + ' öneri aldın — sıkıntı düşmanıyla savaşıyorsun 💪';
  try { localStorage.setItem('ny_adet', adet); } catch (e) {}
}
try { adet = parseInt(localStorage.getItem('ny_adet'), 10) || 0; } catch (e) {}
sayacEl.textContent = adet ? adet + ' öneri aldın — devam!' : '0 öneri aldın';

buyuk.onclick = rastgele;
document.getElementById('baska').onclick = rastgele;
document.getElementById('kopya').onclick = () => {
  const m = kartIk.textContent + ' ' + kartBas.textContent;
  navigator.clipboard.writeText(m).then(() => {
    document.getElementById('kopya').textContent = '✅ Kopyalandı';
    setTimeout(() => document.getElementById('kopya').textContent = '📋 Kopyala', 1400);
  });
};
filtreEl.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filtre = b.dataset.f;
  filtreEl.querySelectorAll('button').forEach(x => x.classList.toggle('aktif', x === b));
  rastgele();
};
</script>
</body>
</html>
